<svg
  [attr.viewBox]="'0 0 ' + vbW + ' ' + vbH"
  preserveAspectRatio="xMidYMid meet"
  style="width:100%;display:block;"
>
  @for (tick of yTicks; track tick.label) {
    <line
      [attr.x1]="axisX" [attr.y1]="tick.y"
      [attr.x2]="axisRight" [attr.y2]="tick.y"
      stroke="#f0f0f0" stroke-width="1"
    />
    <text
      [attr.x]="axisX - 4" [attr.y]="tick.y + 4"
      text-anchor="end" font-size="10" fill="#aaa"
    >{{ tick.label }}</text>
  }

  @for (x of monthDividers; track x) {
    <line
      [attr.x1]="x" [attr.y1]="plotTop"
      [attr.x2]="x" [attr.y2]="axisY + 4"
      stroke="#555" stroke-width="0.5"
      stroke-dasharray="2,2"
      opacity="0.6"
    />
  }

  @for (bar of bars; track $index) {
    @if (bar.greenH > 0.5) {
      <rect
        [attr.x]="bar.x" [attr.y]="bar.greenY"
        [attr.width]="barW" [attr.height]="bar.greenH"
        fill="#4CAF50" opacity="0.85"
      />
    }
    @if (bar.grayH > 0.5) {
      <rect
        [attr.x]="bar.x" [attr.y]="bar.grayY"
        [attr.width]="barW" [attr.height]="bar.grayH"
        fill="#9E9E9E" opacity="0.75"
      />
    }
  }

  @for (line of renderedReferenceLines; track $index) {
    @if (line.points) {
      <polyline
        [attr.points]="line.points"
        fill="none"
        [attr.stroke]="line.color"
        [attr.stroke-width]="line.strokeWidth"
        [attr.stroke-dasharray]="line.dashArray"
        stroke-linejoin="round" stroke-linecap="round"
      />
    }
  }

  <line
    [attr.x1]="axisX" [attr.y1]="axisY"
    [attr.x2]="axisRight" [attr.y2]="axisY"
    stroke="#ddd" stroke-width="1"
  />

  @for (m of monthLabelPositions; track m.label) {
    <text
      [attr.x]="m.x + 2" [attr.y]="axisY + 16"
      text-anchor="start" font-size="10" fill="#888"
    >{{ m.label }}</text>
  }
</svg>
