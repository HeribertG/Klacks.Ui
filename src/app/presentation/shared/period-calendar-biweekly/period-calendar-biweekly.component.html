<div class="container">
  <div class="period-line">
    <span class="custom-counter-span">
      {{ "schedule.schedule-header.schedule-header.biweekly" | translate }}
    </span>
    <span class="filler"></span>
    <select
      name="biweekly"
      id="biweekly"
      class="form-select period-select"
      [(ngModel)]="week"
      (ngModelChange)="onChangeBiweekly()"
    >
      @for (option of biweeklyOptions; track option.startWeek) {
        <option [ngValue]="option.startWeek" [selected]="option.startWeek === week">
          {{ option.label }}
        </option>
      }
    </select>
  </div>
  <div class="custom-counter">
    <span class="custom-counter-span">
      {{ "absence-gantt.absence-gantt-header.absence-gantt-header.year" | translate }}
    </span>
    <span class="filler"></span>
    <app-counter
      [maxNumber]="maxYear"
      [currentNumber]="year"
      (isChanged)="changeYear($event)"
    >
    </app-counter>
  </div>
</div>
