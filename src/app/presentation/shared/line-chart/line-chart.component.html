<div class="lc-wrap" #wrapEl>
  <svg
    #svgEl
    viewBox="0 0 900 220"
    preserveAspectRatio="xMidYMid meet"
    class="lc-svg"
    (mousemove)="onMouseMove($event, svgEl)"
    (mouseleave)="onMouseLeave()"
  >
    @for (g of gridLines(); track $index) {
      <line [attr.x1]="chartLeft" [attr.y1]="g.y" [attr.x2]="chartRight" [attr.y2]="g.y" class="lc-grid" />
      <text [attr.x]="yLabelX" [attr.y]="g.y + 4" class="lc-label lc-label--y">{{ g.label }}</text>
    }

    <line [attr.x1]="chartLeft" [attr.y1]="axisY" [attr.x2]="chartRight" [attr.y2]="axisY" class="lc-axis" />

    @for (t of monthTicks(); track $index) {
      <line [attr.x1]="t.x" [attr.y1]="axisY" [attr.x2]="t.x" [attr.y2]="tickEndY" class="lc-tick" />
      <text [attr.x]="t.x" [attr.y]="xLabelY" class="lc-label lc-label--x">{{ t.label }}</text>
    }

    @if (todayX() !== null) {
      <line [attr.x1]="todayX()" [attr.y1]="todayStartY" [attr.x2]="todayX()" [attr.y2]="axisY" class="lc-today" />
      <text [attr.x]="(todayX() ?? 0) + 3" [attr.y]="todayStartY + 9" class="lc-today-label">{{ todayLabel }}</text>
    }

    @for (p of polylines(); track $index) {
      <polyline
        [attr.points]="p.points"
        [attr.stroke]="p.color"
        [attr.stroke-dasharray]="p.dashed ? '6,3' : '0'"
        fill="none"
        stroke-width="2"
        stroke-linejoin="round"
        stroke-linecap="round"
      />
    }

    @if (tooltip().visible) {
      <line
        [attr.x1]="tooltip().svgX" [attr.y1]="todayStartY"
        [attr.x2]="tooltip().svgX" [attr.y2]="axisY"
        class="lc-crosshair"
      />
    }
  </svg>

  @if (tooltip().visible) {
    <div class="lc-tooltip" [ngStyle]="tooltipStyle()">
      @for (v of tooltip().values; track v.label) {
        <div class="lc-tooltip-row">
          <span class="lc-dot" [ngStyle]="{ background: v.color }"></span>
          {{ v.label }}: {{ v.value }}h
        </div>
      }
    </div>
  }
</div>
