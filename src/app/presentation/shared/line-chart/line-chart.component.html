<div class="lc-wrap" #wrapEl>
  <svg
    #svgEl
    viewBox="0 0 900 220"
    preserveAspectRatio="xMidYMid meet"
    class="lc-svg"
    (mousemove)="onMouseMove($event, svgEl)"
    (mouseleave)="onMouseLeave()"
  >
    @for (g of gridLines(); track g.label) {
      <line [attr.x1]="50" [attr.y1]="g.y" [attr.x2]="890" [attr.y2]="g.y" class="lc-grid" />
      <text [attr.x]="46" [attr.y]="g.y + 4" class="lc-label lc-label--y">{{ g.label }}</text>
    }

    <line x1="50" y1="182" x2="890" y2="182" class="lc-axis" />

    @for (t of monthTicks(); track t.label) {
      <line [attr.x1]="t.x" y1="182" [attr.x2]="t.x" y2="188" class="lc-tick" />
      <text [attr.x]="t.x" y="200" class="lc-label lc-label--x">{{ t.label }}</text>
    }

    @if (todayX() !== null) {
      <line [attr.x1]="todayX()" y1="16" [attr.x2]="todayX()" y2="182" class="lc-today" />
      <text [attr.x]="(todayX() ?? 0) + 3" y="25" class="lc-today-label">Heute</text>
    }

    @for (p of polylines(); track p.color) {
      <polyline
        [attr.points]="p.points"
        [attr.stroke]="p.color"
        [attr.stroke-dasharray]="p.dashed ? '6,3' : '0'"
        fill="none"
        stroke-width="2"
        stroke-linejoin="round"
        stroke-linecap="round"
      />
    }

    @if (tooltip().visible) {
      <line
        [attr.x1]="tooltip().svgX" y1="16"
        [attr.x2]="tooltip().svgX" y2="182"
        class="lc-crosshair"
      />
    }
  </svg>

  @if (tooltip().visible) {
    <div class="lc-tooltip" [ngStyle]="tooltipStyle(wrapEl.getBoundingClientRect())">
      @for (v of tooltip().values; track v.label) {
        <div class="lc-tooltip-row">
          <span class="lc-dot" [ngStyle]="{ background: v.color }"></span>
          {{ v.label }}: {{ v.value }}h
        </div>
      }
    </div>
  }
</div>
