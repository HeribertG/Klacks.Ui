<div class="pie-chart-container">
  <div class="donut-wrapper">
    <svg [attr.width]="width()" [attr.height]="height()" [attr.viewBox]="'0 0 ' + width() + ' ' + height()" class="pie-chart-svg">
      <defs>
        <filter id="donutShadow" x="-10%" y="-10%" width="120%" height="120%">
          <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
        </filter>
        <filter id="sliceShadow" x="-10%" y="-10%" width="120%" height="120%">
          <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.1"/>
        </filter>
      </defs>
      @if (slices.length === 0) {
        <circle
          [attr.cx]="centerX"
          [attr.cy]="centerY"
          [attr.r]="(outerRadius + innerRadius) / 2"
          fill="none"
          stroke="var(--colorLine, #e5e7eb)"
          [attr.stroke-width]="outerRadius - innerRadius"
          opacity="0.4"
        />
      }
      <g filter="url(#donutShadow)">
      @for (slice of slices; track $index) {
        <g class="pie-slice"
           [class.active]="hoveredIndex === $index"
           [style.--hover-transform]="slice.hoverTransform"
           (mouseenter)="hoveredIndex = $index"
           (mouseleave)="hoveredIndex = -1"
           filter="url(#sliceShadow)">
          <path
            [attr.d]="slice.path"
            [attr.fill]="slice.color"
            class="slice-path"
          >
            <title>{{ slice.label }}: {{ slice.value }} ({{ slice.percentage }})</title>
          </path>
        </g>
      }
      </g>
    </svg>
    @if (showTotal()) {
      <div class="donut-center">
        <span class="donut-total-value">{{ total }}</span>
        <span class="donut-total-label">Gesamt</span>
      </div>
    }
  </div>

  @if (slices.length > 0) {
    <div class="pie-chart-legend">
      @for (slice of slices; track $index) {
        <div class="legend-item"
             [class.active]="hoveredIndex === $index"
             (mouseenter)="hoveredIndex = $index"
             (mouseleave)="hoveredIndex = -1">
          <div class="legend-dot" [style.background-color]="slice.color"></div>
          <div class="legend-text">
            <span class="legend-name">{{ slice.label }}</span>
            <span class="legend-value">{{ slice.value }} ({{ slice.percentage }})</span>
          </div>
        </div>
      }
    </div>
  }
</div>
