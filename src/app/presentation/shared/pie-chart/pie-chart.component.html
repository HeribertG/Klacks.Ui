<div class="pie-chart-container">
  <div class="donut-wrapper">
    <svg [attr.width]="width" [attr.height]="height" class="pie-chart-svg">
      <defs>
        <filter id="donut-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15"/>
        </filter>
      </defs>
      <g filter="url(#donut-shadow)">
        @for (slice of slices; track $index) {
          <g class="pie-slice" [style.--hover-transform]="slice.hoverTransform">
            <path
              [attr.d]="slice.path"
              [attr.fill]="slice.color"
              class="slice-path"
            >
              <title>{{ slice.label }}: {{ slice.value }} ({{ slice.percentage }})</title>
            </path>
          </g>
        }
      </g>
    </svg>
    @if (showTotal) {
      <div class="donut-center">
        <span class="donut-total-value">{{ total }}</span>
        <span class="donut-total-label">Gesamt</span>
      </div>
    }
  </div>

  <div class="pie-chart-legend">
    @for (slice of slices; track $index) {
      <div class="legend-item">
        <div class="legend-color" [style.background-color]="slice.color"></div>
        <div class="legend-label">
          <span class="legend-name">{{ slice.label }}</span>
          <span class="legend-value">{{ slice.value }} ({{ slice.percentage }})</span>
        </div>
      </div>
    }
  </div>
</div>
