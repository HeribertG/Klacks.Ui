<div
  class="voice-shell touch-no-callout"
  appLongPressContext
  role="button"
  tabindex="0"
  [class.error-active]="errorHint() !== null && !errorHint()!.persistent"
  [class.error-persistent]="errorHint()?.persistent"
  (click)="handleClick()"
  (keydown.enter)="handleClick()"
  (keydown.space)="handleClick(); $event.preventDefault()"
  (contextmenu)="handleContextMenu($event)"
  [attr.title]="errorHint() ? (errorHint()!.i18nKey | translate) : null"
>
  <app-voice-shell-icon [state]="effectiveState()" />

  @if (isIdle()) {
    <button
      type="button"
      class="clear-btn"
      (click)="handleClearChat($event)"
      [attr.aria-label]="'klacksy.voice.clear-chat' | translate"
    >
      <app-icon-trash-red aria-hidden="true" />
    </button>
    <button
      type="button"
      class="close-btn"
      (click)="handleClose($event)"
      [attr.aria-label]="'klacksy.voice.close' | translate"
    >
      ×
    </button>
  }
</div>
