<div class="main-container" role="navigation" aria-label="Main navigation">
  <div class="main-cell">
    <div class="icon_group">
      <button
        type="button"
        class="icon-button"
        id="open-absences"
        (click)="onClickAbsence()"
        [attr.aria-label]="'Manage absences (Alt+1)'"
        placement="right"
        ngbTooltip="{{ absence }} (Alt+1)"
      >
        <app-icon-gantt #absenceIcon></app-icon-gantt>
      </button>
    </div>

    @if (isAdmin()) {
      <div class="icon">
        <button
          type="button"
          class="icon-button"
          id="open-groups"
          (click)="onClickGroup()"
          [attr.aria-label]="'Manage groups (Alt+2)'"
          placement="right"
          ngbTooltip="{{ all_group }} (Alt+2)"
        >
          <app-icon-group #groupIcon></app-icon-group>
        </button>
      </div>
    }

    <div class="icon">
      <button
        type="button"
        class="icon-button"
        id="open-shifts"
        (click)="onClickShift()"
        [attr.aria-label]="'Manage shifts (Alt+3)'"
        placement="right"
        ngbTooltip="{{ all_shift }} (Alt+3)"
      >
        <app-icon-order #shiftIcon></app-icon-order>
      </button>
    </div>

    <div class="icon">
      <button
        type="button"
        class="icon-button"
        id="open-schedules"
        (click)="onClickSchedule()"
        [attr.aria-label]="'Manage schedules (Alt+4)'"
        placement="right"
        ngbTooltip="{{ all_schedule }} (Alt+4)"
      >
        <app-time-schedule #scheduleIcon></app-time-schedule>
      </button>
    </div>

    <div class="icon">
      <button
        type="button"
        class="icon-button"
        id="open-employees"
        (click)="onClickClients()"
        [attr.aria-label]="'Manage employees (Alt+5)'"
        placement="right"
        ngbTooltip="{{ all_employee }} (Alt+5)"
      >
        <app-icon-clients #employeesIcon></app-icon-clients>
      </button>
    </div>

    @if (inboxVisibilityService.isAvailable()) {
      <div class="icon">
        <button
          type="button"
          class="icon-button inbox-button"
          id="open-inbox"
          (click)="onClickInbox()"
          [attr.aria-label]="'Open Inbox (Alt+9)'"
          placement="right"
          ngbTooltip="{{ inbox }} (Alt+9)"
        >
          <app-icon-mail #mailIcon></app-icon-mail>
          @if (inboxService.inboxUnreadCount() > 0) {
            <span class="unread-badge">{{ inboxService.inboxUnreadCount() }}</span>
          }
        </button>
      </div>
    }
  </div>

  <div class="main-bottomcell">
    @if (!hasProfileImage()) {
      <div class="icon icon_user">
        <button
          type="button"
          class="icon-button"
          id="open-profile"
          (click)="onClickProfile()"
          [attr.aria-label]="'Open profile (Alt+7)'"
        >
          <app-icon-user #userIcon></app-icon-user>
        </button>
      </div>
    }
    @if (hasProfileImage()) {
      <div class="imgIconContainer">
        <button
          type="button"
          class="icon-button profile-img-button"
          id="open-profile"
          (click)="onClickProfile()"
          [attr.aria-label]="'Open profile (Alt+7)'"
        >
          <img
            [src]="dataLoadFileService.profileImage$()"
            [attr.alt]="'Profile picture'"
            class="imgIcon"
          />
        </button>
      </div>
    }
    @if (isAdmin()) {
      <div class="icon">
        <button
          type="button"
          class="icon-button"
          id="open-settings"
          (click)="onClickSettings()"
          [attr.aria-label]="'Open Settings (Alt+8)'"
        >
          <app-icon-setting #settingsIcon></app-icon-setting>
        </button>
      </div>
    }
  </div>
</div>
