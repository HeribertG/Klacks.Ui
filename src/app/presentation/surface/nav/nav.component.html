<div class="main-container" role="navigation" aria-label="Main navigation">
  <div class="main-cell">
    <div class="icon_group">
      <button
        type="button"
        class="icon-button"
        id="open-absences"
        (click)="onClickAbsence()"
        [attr.aria-label]="'Manage absences (Alt+1)'"
        placement="right"
        ngbTooltip="{{ absence }} (Alt+1)"
      >
        <app-icon-gantt #absenceIcon></app-icon-gantt>
      </button>
    </div>

    @if (isAdmin()) {
      <div class="icon">
        <button
          type="button"
          class="icon-button"
          id="open-groups"
          (click)="onClickGroup()"
          [attr.aria-label]="'Manage groups (Alt+2)'"
          placement="right"
          ngbTooltip="{{ all_group }} (Alt+2)"
        >
          <app-icon-group #groupIcon></app-icon-group>
        </button>
      </div>
    }

    <div class="icon">
      <button
        type="button"
        class="icon-button"
        id="open-shifts"
        (click)="onClickShift()"
        [attr.aria-label]="'Manage shifts (Alt+3)'"
        placement="right"
        ngbTooltip="{{ all_shift }} (Alt+3)"
      >
        <app-icon-order #shiftIcon></app-icon-order>
      </button>
    </div>

    <div class="icon">
      <button
        type="button"
        class="icon-button"
        id="open-schedules"
        (click)="onClickSchedule()"
        [attr.aria-label]="'Manage schedules (Alt+4)'"
        placement="right"
        ngbTooltip="{{ all_schedule }} (Alt+4)"
      >
        <app-time-schedule #scheduleIcon></app-time-schedule>
      </button>
    </div>

    <div class="icon">
      <button
        type="button"
        class="icon-button"
        id="open-employees"
        (click)="onClickClients()"
        [attr.aria-label]="'Manage employees (Alt+5)'"
        placement="right"
        ngbTooltip="{{ all_employee }} (Alt+5)"
      >
        <app-icon-clients #employeesIcon></app-icon-clients>
      </button>
    </div>
  </div>

  @if (isAdmin()) {
    <div class="icon inbox-icon-wrapper">
      <button
        type="button"
        class="icon-button"
        id="open-inbox"
        (click)="onClickInbox()"
        [attr.aria-label]="'Open Inbox (Alt+9)'"
        placement="right"
        ngbTooltip="Inbox (Alt+9)"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="2" y="4" width="20" height="16" rx="2" />
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
        </svg>
        @if (inboxService.unreadCount() > 0) {
          <span class="unread-badge">{{ inboxService.unreadCount() }}</span>
        }
      </button>
    </div>
  }

  <div class="main-bottomcell">
    @if (!hasProfileImage()) {
      <div class="icon icon_user">
        <button
          type="button"
          class="icon-button"
          id="open-profile"
          (click)="onClickProfile()"
          [attr.aria-label]="'Open profile (Alt+7)'"
        >
          <app-icon-user #userIcon></app-icon-user>
        </button>
      </div>
    }
    @if (hasProfileImage()) {
      <div class="imgIconContainer">
        <button
          type="button"
          class="icon-button profile-img-button"
          id="open-profile"
          (click)="onClickProfile()"
          [attr.aria-label]="'Open profile (Alt+7)'"
        >
          <img
            [src]="dataLoadFileService.profileImage$()"
            [attr.alt]="'Profile picture'"
            class="imgIcon"
          />
        </button>
      </div>
    }
    @if (isAdmin()) {
      <div class="icon">
        <button
          type="button"
          class="icon-button"
          id="open-settings"
          (click)="onClickSettings()"
          [attr.aria-label]="'Open Settings (Alt+8)'"
        >
          <app-icon-setting #settingsIcon></app-icon-setting>
        </button>
      </div>
    }
  </div>
</div>
