<!-- eslint-disable @angular-eslint/template/click-events-have-key-events -->

<div class="header-container">
  @if (!hasLogoImage()) {
    <div id="header-logo-icon" class="icon" (click)="onClickDashboard()">
      <app-icon-logo></app-icon-logo>
    </div>
  }
  @if (hasLogoImage()) {
    <div id="header-logo-image" (click)="onClickDashboard()" class="icon1">
      <img
        [src]="logoImage()"
        [width]="logoDisplayDimensions().width"
        [height]="logoDisplayDimensions().height"
        alt="Logo"
      />
    </div>
  }

  @if (!searchService.isClientSearchMode()) {
    <app-search></app-search>
  }
  @if (searchService.isClientSearchMode()) {
    <app-search-client (clientSelected)="onClientSelected($event)"></app-search-client>
  }

  <span id="header-version" class="version">{{ version() }}</span>

  <span class="filler"></span>

  <app-group-select></app-group-select>

  @if (!hideAssistantButton()) {
    <app-icon-mml
      id="header-assistant-button"
      class="assistant-btn"
      (click)="onToggleAssistant()"
    ></app-icon-mml>
  }

  <app-icon-sign-out
    id="header-logout-button"
    class="icon-logOut"
    (click)="onClickLogOut()"
  ></app-icon-sign-out>
</div>
