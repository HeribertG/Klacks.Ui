<div class="modal-header color-red">
  <div id="modal-title">{{ title }}</div>
</div>
<div class="modal-body row-line-modal">
  <div class="gap-modal">
    <app-icon-attention-icon-grey></app-icon-attention-icon-grey>
  </div>
  {{ message }}
</div>
<div class="modal-footer" *ngIf="activeModal">
  <button type="button" class="btn btn-secondary" (click)="activeModal!.dismiss()">
    {{ 'cancel' | translate }}
  </button>
  <button type="button" class="btn btn-danger" (click)="activeModal!.close('delete')">
    {{ 'delete' | translate }}
  </button>
</div>
