<!-- Suggested Replies Overlay -->
<div class="replies-overlay" role="dialog" aria-label="Suggested replies">
  <!-- Close button -->
  <button
    type="button"
    class="replies-close-btn"
    (click)="onDismiss()"
    aria-label="Close"
  >
    <fa-icon [icon]="faTimes"></fa-icon>
  </button>

  <!-- Prompt heading -->
  @if (config().prompt) {
  <div class="replies-prompt">{{ config().prompt }}</div>
  }

  <!-- Single-select: chips -->
  @if (config().selectionMode === 'single') {
  <div class="replies-chips">
    @for (option of config().options; track option.value) {
    <button
      type="button"
      class="reply-chip"
      (click)="onChipClick(option.value)"
      [attr.aria-label]="option.label"
    >
      {{ option.label }}
    </button>
    }
  </div>
  }

  <!-- Multi-select: checkboxes + confirm -->
  @if (config().selectionMode === 'multi') {
  <div class="replies-checkboxes">
    @for (option of config().options; track option.value) {
    <label class="reply-checkbox-label" [class.checked]="isChecked(option.value)">
      <input
        type="checkbox"
        [checked]="isChecked(option.value)"
        (change)="onCheckboxToggle(option.value)"
      />
      <span class="checkbox-text">{{ option.label }}</span>
    </label>
    }
  </div>
  <button
    type="button"
    class="replies-confirm-btn"
    [disabled]="checkedValues().size === 0"
    (click)="onConfirm()"
  >
    <fa-icon [icon]="faCheck"></fa-icon>
  </button>
  }
</div>
