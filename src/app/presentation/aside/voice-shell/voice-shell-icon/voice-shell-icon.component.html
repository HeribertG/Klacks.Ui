<div class="icon-root" [class]="stateClass()">
  @if (isListening()) {
    <span class="pulse-ring" aria-hidden="true"></span>
  }
  <div class="icon-core">
    @if (isSpeaking()) {
      <div class="wave-group" role="img" aria-label="speaking">
        @for (i of waveBars; track i) {
          <span class="wave-bar" [style.animation-delay.ms]="i * 150"></span>
        }
      </div>
    } @else if (isSpinning()) {
      <span class="spinner" aria-hidden="true">&#8943;</span>
    } @else {
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a1 1 0 1 1 2 0 7 7 0 0 1-6 6.92V21h-2v-3.08A7 7 0 0 1 5 11a1 1 0 1 1 2 0 5 5 0 0 0 10 0z"/>
      </svg>
    }
  </div>
</div>
