<div
  #boxCalendar
  id="absence-surface-box"
  class="box-calendar"
  appResize
  (resizeElement)="onResize($event)"
>
  <canvas
    appAbsenceCalendar
    appTouchGesture
    appLongPressContext
    class="touch-surface"
    id="absence-surface-canvas"
    [touchDragPredicate]="isPointerOnSelectedBar"
    [longPressSuppressPredicate]="isPointerOnBreakAnchor"
    (touchPan)="onTouchPan($event)"
    (dragover)="dragOver($event)"
    (drop)="drop($event)"
    aria-label="Absence Calendar"
    aria-labelledby="The Absence Gantt."
  >
  </canvas>
</div>
<app-context-menu id="absence-surface-context-menu" #contextMenu></app-context-menu>
