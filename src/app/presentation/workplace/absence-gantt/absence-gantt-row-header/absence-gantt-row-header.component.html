<div
  id="absence-row-header-filter"
  class="gantt-filter-windows"
  [ngStyle]="filterStyle"
  (mouseleave)="onMouseLeave()"
>
  <app-client-filter
    [filter]="dataManagementBreak.breakFilter"
    (filterChange)="onFilterChange()"
  ></app-client-filter>
</div>

<div
  #boxCalendarRowHeader
  id="absence-row-header-box"
  class="box-calendar"
  appResize
  (resizeElement)="onResize($event)"
>
  <canvas
    id="absence-row-header-canvas"
    class="calendar"
    (mousemove)="onMouseMove($event)"
    (click)="onClick($event)"
    aria-labelledby="Row Header of the Absence Gantt."
  ></canvas>
</div>
