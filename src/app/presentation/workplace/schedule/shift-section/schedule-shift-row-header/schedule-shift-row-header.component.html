<div
  #box
  id="shift-row-header-box"
  class="box-row-header"
  appResize
  (resizeElement)="onResize($event)"
  (mousemove)="onCanvasMouseMove($event)"
  (mouseleave)="onCanvasMouseLeave()"
>
  <canvas
    id="shiftRowHeaderCanvas"
    class="row-header-canvas"
    aria-labelledby="Row Header of the Shift Section"
    appShiftRowHeaderEvents
  ></canvas>
</div>
