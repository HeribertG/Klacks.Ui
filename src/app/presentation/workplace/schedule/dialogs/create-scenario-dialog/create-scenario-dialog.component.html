<ng-template #createScenarioModal>
  <div class="modal-header">
    <h5 class="modal-title">{{ 'scenario.create' | translate }}</h5>
    <button type="button" class="btn-close" (click)="onCancel()" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <div class="mb-3">
      <label class="form-label">{{ 'scenario.name' | translate }}</label>
      <input
        type="text"
        class="form-control"
        [ngModel]="scenarioName()"
        (ngModelChange)="scenarioName.set($event)"
        autofocus
      />
    </div>
    <div class="mb-3">
      <label class="form-label">{{ 'scenario.description' | translate }}</label>
      <input
        type="text"
        class="form-control"
        [ngModel]="description()"
        (ngModelChange)="description.set($event)"
      />
    </div>
    <div class="row">
      <div class="col-6">
        <label class="form-label">{{ 'scenario.fromDate' | translate }}</label>
        <input
          type="date"
          class="form-control"
          [ngModel]="fromDate()"
          (ngModelChange)="fromDate.set($event)"
        />
      </div>
      <div class="col-6">
        <label class="form-label">{{ 'scenario.untilDate' | translate }}</label>
        <input
          type="date"
          class="form-control"
          [ngModel]="untilDate()"
          (ngModelChange)="untilDate.set($event)"
        />
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="onCancel()">
      {{ 'common.cancel' | translate }}
    </button>
    <button
      type="button"
      class="btn btn-primary"
      [disabled]="!isValid() || isSaving()"
      (click)="onConfirm()"
    >
      @if (isSaving()) {
        <span class="spinner-border spinner-border-sm me-1"></span>
      }
      {{ 'scenario.create' | translate }}
    </button>
  </div>
</ng-template>
