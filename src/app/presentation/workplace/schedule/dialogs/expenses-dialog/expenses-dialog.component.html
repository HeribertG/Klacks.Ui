<!-- eslint-disable @angular-eslint/template/click-events-have-key-events -->
<!-- eslint-disable @angular-eslint/template/interactive-supports-focus -->
<ng-template #expensesModal let-modal>
  <div class="modal-header">
    <div class="modal-title">{{ "dialog.expenses.title" | translate }}</div>
    <span class="filler"></span>
    <div class="close" (click)="onCancel()">&times;</div>
  </div>

  <div class="modal-body">
    <div class="form-group">
      <label for="amount">{{ "dialog.expenses.amount" | translate }}</label>
      <input
        type="number"
        id="amount"
        class="form-control"
        [(ngModel)]="amount"
        min="0"
        step="0.01"
      />
    </div>

    <div class="form-group">
      <label for="description">{{ "dialog.expenses.description" | translate }}</label>
      <textarea
        id="description"
        [(ngModel)]="description"
        class="form-control"
        rows="3"
      ></textarea>
    </div>

    <div class="form-group checkbox-group">
      <label class="checkbox-label">
        <input type="checkbox" [(ngModel)]="taxable" />
        {{ "dialog.expenses.taxable" | translate }}
      </label>
    </div>
  </div>

  <div class="modal-footer">
    <span class="link-button red-font" (click)="onCancel()">
      {{ "cancel" | translate }}
    </span>
    <button
      type="button"
      class="btn save-btn"
      (click)="onSave()"
      [disabled]="!isValid()"
    >
      {{ "save" | translate }}
    </button>
  </div>
</ng-template>
