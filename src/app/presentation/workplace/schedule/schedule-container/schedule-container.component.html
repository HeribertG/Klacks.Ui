<as-split direction="horizontal">
  <as-split-area>
    <as-split direction="vertical" [gutterSize]="6" unit="percent">
      <as-split-area [size]="70" [minSize]="10">
        <app-schedule-section
          #scheduleSection
          [zoom]="zoom"
          [refreshTrigger]="refreshTrigger"
          (horizontalSizeChange)="onHorizontalSizeChange($event)"
        >
        </app-schedule-section>
      </as-split-area>

      <as-split-area [size]="30" [minSize]="10">
        <app-shift-section
          [zoom]="zoom"
          [refreshTrigger]="refreshTrigger"
          [horizontalSize]="horizontalSize"
        >
        </app-shift-section>
      </as-split-area>
    </as-split>
  </as-split-area>

  <as-split-area [maxSize]="20" unit="percent" [visible]="IsInfoVisible">
    <div class="info"></div>
  </as-split-area>
</as-split>

@if (shiftDragService.isDragging()) {
  <div
    class="drag-overlay"
    [class.valid-drop]="shiftDragService.showValidIndicator()"
    [class.invalid-drop]="shiftDragService.showInvalidIndicator()"
    [style.left.px]="shiftDragService.dragStartX()"
    [style.top.px]="shiftDragService.currentY()"
  >
    {{ shiftDragService.dragData()?.abbreviation }}
  </div>
}
