<as-split direction="horizontal" [dir]="direction()">
  <as-split-area>
    <as-split direction="vertical" [gutterSize]="6" unit="percent">
      <as-split-area [size]="70" [minSize]="10">
        <app-schedule-section
          #scheduleSection
          [zoom]="zoom()"
          [refreshTrigger]="refreshTrigger()"
          (horizontalSizeChange)="onHorizontalSizeChange($event)"
          (hScrollPositionChange)="onHScrollPositionChange($event)"
        >
        </app-schedule-section>
      </as-split-area>

      <as-split-area [size]="30" [minSize]="10">
        <app-shift-section
          [zoom]="zoom()"
          [refreshTrigger]="refreshTrigger()"
          [horizontalSize]="horizontalSize"
          [hScrollPosition]="hScrollPosition"
        >
        </app-shift-section>
      </as-split-area>
    </as-split>
  </as-split-area>

  <as-split-area [maxSize]="20" unit="percent" [visible]="IsInfoVisible">
    <div class="info"></div>
  </as-split-area>
</as-split>

@if (shiftDragService.isDragging()) {
  <div
    class="drag-overlay"
    [class.valid-drop]="shiftDragService.showValidIndicator()"
    [class.invalid-drop]="shiftDragService.showInvalidIndicator()"
    [style.left.px]="shiftDragService.dragStartX()"
    [style.top.px]="shiftDragService.currentY()"
  >
    {{ shiftDragService.dragData()?.abbreviation }}
  </div>
}

@if (cellDragService.isDragging()) {
  @let source = cellDragService.source();
  <div
    class="cell-drag-overlay"
    [class.delete-drop]="cellDragService.showDeleteIndicator()"
    [class.valid-move]="cellDragService.showMoveIndicator()"
    [class.snap-back]="cellDragService.showSnapBackIndicator()"
    [style.left.px]="source?.startX"
    [style.top.px]="cellDragService.currentY()"
    [style.width.px]="source?.cellWidth"
    [style.height.px]="source?.cellHeight"
  >
    @if (source?.snapshotDataUrl) {
      <img class="snapshot" [src]="source?.snapshotDataUrl" alt="" draggable="false" />
    } @else {
      <span class="label">{{ source?.abbreviation }}</span>
    }
    @if (cellDragService.showDeleteIndicator()) {
      <span class="icon" aria-hidden="true">&#x1F5D1;</span>
    }
  </div>
}
