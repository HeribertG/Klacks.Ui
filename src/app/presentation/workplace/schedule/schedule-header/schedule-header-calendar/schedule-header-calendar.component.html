<!-- eslint-disable @angular-eslint/template/interactive-supports-focus -->
<div class="container">
  <div class="month-line">
    <span class="custom-counter-span"
      >{{ "schedule.schedule-header.schedule-header.month" | translate }}
    </span>
    <span class="filler"></span>
    <select
      name="month"
      id="month"
      class="form-select month"
      [(ngModel)]="selectedMonth"
      (ngChange)="onChangeMonth()"
    >
      @for (c of gridSettingsService.monthsName; track $index; let i = $index) {
      <option [ngValue]="i + 1" [selected]="i + 1 === selectedMonth">
        {{ c | translate }}
      </option>
      }
    </select>
  </div>
  <div class="custom-counter">
    <span class="custom-counter-span"
      >{{
        "absence-gantt.absence-gantt-header.absence-gantt-header.year"
          | translate
      }}
    </span>
    <span class="filler"></span>
    <app-counter
      [maxNumber]="maxYear"
      [currentNumber]="currentYear"
      (isChanged)="changeYear($event)"
    >
    </app-counter>
  </div>
</div>
<div class="row-line-simple">
  <div
    ngbDropdownItem
    class="btn btn-sm btn-info close"
    (click)="onClickReset()"
  >
    {{ "group.edit-group.edit-group-member.add" | translate }}
  </div>
</div>

<div class="shift-filter-section">
  <div class="filter-header">
    <span class="custom-counter-span">{{ "schedule.shift-filter.title" | translate }}</span>
  </div>

  <div class="filter-row">
    <input
      type="text"
      class="form-control form-control-sm"
      placeholder="{{ 'schedule.shift-filter.search-placeholder' | translate }}"
      [(ngModel)]="dataManagementSchedule.shiftScheduleFilter.searchString"
      (input)="onShiftFilterChange()"
    />
  </div>

  <div class="filter-row">
    <div ngbDropdown>
      <button
        class="btn btn-outline-primary btn-sm"
        id="shiftTypeDropdown"
        ngbDropdownToggle
      >
        {{ "schedule.shift-filter.type" | translate }}
      </button>
      <div ngbDropdownMenu aria-labelledby="shiftTypeDropdown">
        <div class="form-group px-2">
          <div class="radio-container">
            <label class="radio-label">
              <input
                type="radio"
                name="shiftTypeFilter"
                [value]="undefined"
                [checked]="dataManagementSchedule.shiftScheduleFilter.shiftType === undefined"
                (change)="onShiftTypeChange(undefined)"
              />
              {{ "all" | translate }}
            </label>
            <label class="radio-label">
              <input
                type="radio"
                name="shiftTypeFilter"
                [value]="0"
                [checked]="dataManagementSchedule.shiftScheduleFilter.shiftType === 0"
                (change)="onShiftTypeChange(0)"
              />
              {{ "shift.all-shift.nav.original" | translate }}
            </label>
            <label class="radio-label">
              <input
                type="radio"
                name="shiftTypeFilter"
                [value]="1"
                [checked]="dataManagementSchedule.shiftScheduleFilter.shiftType === 1"
                (change)="onShiftTypeChange(1)"
              />
              {{ "shift.all-shift.nav.planbar" | translate }}
            </label>
            <label class="radio-label">
              <input
                type="radio"
                name="shiftTypeFilter"
                [value]="2"
                [checked]="dataManagementSchedule.shiftScheduleFilter.shiftType === 2"
                (change)="onShiftTypeChange(2)"
              />
              Container
            </label>
            <label class="radio-label">
              <input
                type="radio"
                name="shiftTypeFilter"
                [value]="3"
                [checked]="dataManagementSchedule.shiftScheduleFilter.shiftType === 3"
                (change)="onShiftTypeChange(3)"
              />
              Absence
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="filter-row checkbox-row">
    <label class="checkbox-label">
      <input
        type="checkbox"
        [(ngModel)]="dataManagementSchedule.shiftScheduleFilter.isSporadic"
        (change)="onShiftFilterChange()"
        name="shiftIsSporadic"
      />
      {{ "shift.all-shift.nav.sporadic" | translate }}
    </label>
    <label class="checkbox-label">
      <input
        type="checkbox"
        [(ngModel)]="dataManagementSchedule.shiftScheduleFilter.isTimeRange"
        (change)="onShiftFilterChange()"
        name="shiftIsTimeRange"
      />
      {{ "shift.all-shift.nav.time-range" | translate }}
    </label>
  </div>

  <div class="filter-row">
    <button class="btn btn-sm btn-outline-secondary" (click)="clearShiftFilters()">
      {{ "schedule.shift-filter.clear" | translate }}
    </button>
  </div>
</div>
