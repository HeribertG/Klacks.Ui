<!-- eslint-disable @angular-eslint/template/interactive-supports-focus -->
<div class="container">
  <div class="month-line">
    <span class="custom-counter-span"
      >{{ "schedule.schedule-header.schedule-header.month" | translate }}
    </span>
    <span class="filler"></span>
    <select
      name="month"
      id="month"
      class="form-select month"
      [(ngModel)]="selectedMonth"
      (ngChange)="onChangeMonth()"
    >
      @for (c of gridSettingsService.monthsName; track $index; let i = $index) {
      <option [ngValue]="i + 1" [selected]="i + 1 === selectedMonth">
        {{ c | translate }}
      </option>
      }
    </select>
  </div>
  <div class="custom-counter">
    <span class="custom-counter-span"
      >{{
        "absence-gantt.absence-gantt-header.absence-gantt-header.year"
          | translate
      }}
    </span>
    <span class="filler"></span>
    <app-counter
      [maxNumber]="maxYear"
      [currentNumber]="currentYear"
      (isChanged)="changeYear($event)"
    >
    </app-counter>
  </div>
</div>
<div class="row-line-simple">
  <div
    ngbDropdownItem
    class="btn btn-sm btn-info close"
    (click)="onClickReset()"
  >
    {{ "group.edit-group.edit-group-member.add" | translate }}
  </div>
</div>

<div class="shift-filter-section">
  <div class="filter-header">
    <span class="custom-counter-span">{{ "schedule.shift-filter.title" | translate }}</span>
  </div>

  <div class="filter-row">
    <input
      type="text"
      class="form-control form-control-sm"
      placeholder="{{ 'schedule.shift-filter.search-placeholder' | translate }}"
      [(ngModel)]="dataManagementSchedule.shiftScheduleFilter.searchString"
      (input)="onShiftFilterChange()"
    />
  </div>

  <div class="filter-row checkbox-row">
    <label class="checkbox-label">
      <input
        type="checkbox"
        [(ngModel)]="dataManagementSchedule.shiftScheduleFilter.isSporadic"
        (change)="onShiftFilterChange()"
        name="shiftIsSporadic"
      />
      {{ "shift.all-shift.nav.sporadic" | translate }}
    </label>
    <label class="checkbox-label">
      <input
        type="checkbox"
        [(ngModel)]="dataManagementSchedule.shiftScheduleFilter.isTimeRange"
        (change)="onShiftFilterChange()"
        name="shiftIsTimeRange"
      />
      {{ "shift.all-shift.nav.time-range" | translate }}
    </label>
    <label class="checkbox-label">
      <input
        type="checkbox"
        [(ngModel)]="dataManagementSchedule.shiftScheduleFilter.container"
        (change)="onShiftFilterChange()"
        name="shiftContainer"
      />
      {{ "shift.all-shift.nav.container" | translate }}
    </label>
    <label class="checkbox-label">
      <input
        type="checkbox"
        [(ngModel)]="dataManagementSchedule.shiftScheduleFilter.isStandartShift"
        (change)="onShiftFilterChange()"
        name="shiftIsStandartShift"
      />
      {{ "shift.all-shift.nav.standart-shift" | translate }}
    </label>
  </div>

  <div class="filter-row">
    <button class="btn btn-sm btn-outline-secondary" (click)="clearShiftFilters()">
      {{ "schedule.shift-filter.clear" | translate }}
    </button>
  </div>
</div>
