<div ngbDropdown>
  <button
    id="scenario-selector-btn"
    class="btn btn-sm scenario-btn"
    ngbDropdownToggle
    [class.scenario-active]="analyseScenarioService.isScenarioMode()"
  >
    @if (analyseScenarioService.isScenarioMode()) {
      <span class="scenario-indicator"></span>
      {{ analyseScenarioService.activeScenario()?.name }}
    } @else {
      {{ "scenario.title" | translate }}
    }
  </button>
  <div ngbDropdownMenu>
    @if (analyseScenarioService.isScenarioMode()) {
      <button id="scenario-selector-exit-item" ngbDropdownItem (click)="onExitScenario()">
        {{ "scenario.exit" | translate }}
      </button>
      <div class="dropdown-divider"></div>
      @if (canDecide()) {
        <button id="scenario-selector-accept-item" ngbDropdownItem class="text-success" (click)="onAccept()">
          {{ "scenario.accept" | translate }}
        </button>
        <button id="scenario-selector-reject-item" ngbDropdownItem class="text-danger" (click)="onReject()">
          {{ "scenario.reject" | translate }}
        </button>
      }
      <button id="scenario-selector-rename-item" ngbDropdownItem (click)="onRename()">
        {{ "scenario.rename" | translate }}
      </button>
      <div class="dropdown-divider"></div>
    }
    @for (scenario of analyseScenarioService.scenarios(); track scenario.id) {
      <button
        ngbDropdownItem
        [attr.data-scenario-id]="scenario.id"
        (click)="onSelectScenario(scenario)"
        [class.active]="
          scenario.id === analyseScenarioService.activeScenario()?.id
        "
      >
        {{ scenario.name }}
      </button>
    }

    <button id="scenario-selector-create-item" class="new-btn" ngbDropdownItem (click)="onCreateNew()">
      + {{ "scenario.create" | translate }}
    </button>
    @if (analyseScenarioService.scenarios().length > 0) {
      <div class="dropdown-divider"></div>
      <button id="scenario-selector-delete-all-item" ngbDropdownItem class="text-danger" (click)="onDeleteAll()">
        {{ "scenario.deleteAll" | translate }}
      </button>
    }
  </div>
</div>
<app-create-scenario-dialog #createScenarioDialog />
<app-rename-scenario-dialog #renameScenarioDialog />
<app-delete-all-scenarios-dialog #deleteAllScenariosDialog />
