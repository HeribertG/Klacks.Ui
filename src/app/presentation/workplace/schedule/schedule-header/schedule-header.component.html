<div class="custom-control-inline">
  <button
    id="schedule-prev-btn"
    class="btn btn-sm btn-nav calendar-previous-next"
    (click)="goToPrevious()"
    aria-label="previous period"
  >
    @if (isRtl) {
      <app-icon-angle-right />
    } @else {
      <app-icon-angle-left />
    }
  </button>
  <div ngbDropdown #dropdownSetting="ngbDropdown">
    <button
      class="btn btn-sm calendar-setting"
      id="dropdownSetting"
      ngbDropdownToggle
      aria-label="calendar settings"
    >
      <span>{{ displayPeriod }} {{ displayYear }}</span>
    </button>
    <div ngbDropdownMenu>
      @switch (paymentInterval) {
        @case (0) {
          <app-period-calendar-weekly
            [year]="currentYear"
            [week]="selectedWeek"
            (periodChanged)="onCalendarReset($event)"
          ></app-period-calendar-weekly>
        }
        @case (1) {
          <app-period-calendar-biweekly
            [year]="currentYear"
            [week]="selectedWeek"
            (periodChanged)="onCalendarReset($event)"
          ></app-period-calendar-biweekly>
        }
        @default {
          <app-period-calendar-monthly
            [year]="currentYear"
            [month]="selectedMonth"
            (periodChanged)="onCalendarReset($event)"
          ></app-period-calendar-monthly>
        }
      }
    </div>
  </div>
  <button
    id="schedule-next-btn"
    class="btn btn-sm btn-nav calendar-previous-next"
    (click)="goToNext()"
    aria-label="next period"
  >
    @if (isRtl) {
      <app-icon-angle-left />
    } @else {
      <app-icon-angle-right />
    }
  </button>

  @if (isEmailConfigured()) {
    <button
      id="schedule-send-email-btn"
      type="button"
      class="send-email-button"
      [class.disabled]="isSendDisabled()"
      (click)="onSendAllSchedules()"
      ngbTooltip="{{ 'schedule.sendEmail.tooltip' | translate }}"
    >
      @if (isSending()) {
        <span class="spinner-border spinner-border-sm"></span>
      } @else {
        <app-icon-fly />
      }
    </button>
  }

  @if (isWizardDropdownMode()) {
    <div ngbDropdown class="wizard-dropdown">
      <button
        id="schedule-wizard-btn"
        type="button"
        class="icon-button wizard-button"
        ngbDropdownToggle
      >
        <app-icon-wizard />
      </button>
      <div ngbDropdownMenu aria-labelledby="schedule-wizard-btn">
        <button ngbDropdownItem (click)="onWizardClick()">
          {{ "autoWizard.menu.plan" | translate }}
        </button>
        <button ngbDropdownItem (click)="onHarmonizerClick()">
          {{ "autoWizard.menu.fuzzyHarmonizer" | translate }}
        </button>
        <button ngbDropdownItem (click)="onHolisticHarmonizerClick()">
          {{ "autoWizard.menu.holisticHarmonizer" | translate }}
        </button>
      </div>
    </div>
  } @else {
    <button
      id="schedule-wizard-btn"
      type="button"
      class="icon-button wizard-button"
      [class.disabled]="isAutoWizardRunning()"
      (click)="onAutoWizardClick()"
      ngbTooltip="{{ 'autoWizard.tooltip' | translate }}"
    >
      @if (isAutoWizardRunning()) {
        <span class="spinner-border spinner-border-sm"></span>
      } @else {
        <app-icon-wizard />
      }
    </button>
  }

  <app-wizard-dialog #wizardDialog />

  <app-harmonizer-dialog #harmonizerDialog />

  <app-holistic-harmonizer-dialog #holisticHarmonizerDialog />

  <button
    id="schedule-pdf-export-btn"
    type="button"
    class="icon-button pdf-export-button"
    (click)="onPdfExport()"
    ngbTooltip="{{ 'schedule.pdf.schedule' | translate }}"
  >
    <app-icon-pdf-icon></app-icon-pdf-icon>
  </button>

  @if (!isTimelineMode()) {
    <button
      id="schedule-break-placeholder-toggle"
      type="button"
      class="icon-button break-placeholder-toggle"
      [class.active]="showBreakPlaceholders"
      (click)="toggleBreakPlaceholders()"
      ngbTooltip="{{ 'schedule.breakPlaceholder.toggle' | translate }}"
    >
      <app-icon-break-placeholder #breakPlaceholderIcon />
    </button>
  }

  @if (!isTimelineMode()) {
    <button
      id="schedule-commands-toggle"
      type="button"
      class="icon-button break-placeholder-toggle"
      [class.active]="showScheduleCommands"
      (click)="toggleScheduleCommands()"
      ngbTooltip="{{ 'schedule.toolbar.toggle-commands' | translate }}"
    >
      <app-icon-thunder-circle #scheduleCommandsIcon />
    </button>
  }

  @if (hasAvailabilityData()) {
    <button
      id="schedule-availability-check-btn"
      type="button"
      class="icon-button availability-check-button"
      [class.active]="showAvailability"
      (click)="onAvailabilityCheck()"
      ngbTooltip="{{ 'schedule.availability.toggle' | translate }}"
    >
      <app-icon-availability-check #availabilityCheckIcon />
    </button>
  }

  <button
    id="schedule-recalculate-btn"
    type="button"
    class="icon-button recalculate-button"
    [class.disabled]="isRecalculating()"
    (click)="onRecalculatePeriodHours()"
    ngbTooltip="{{ 'schedule.recalculate.tooltip' | translate }}"
  >
    @if (isRecalculating()) {
      <span class="spinner-border spinner-border-sm"></span>
    } @else {
      <app-icon-refresh-schedule />
    }
  </button>

  <app-scenario-selector ngbTooltip="{{ 'scenario.select' | translate }}" />

  <div
    class="main-switch-wrapper view-mode-switch"
    ngbTooltip="{{ 'schedule.toolbar.timeline-view' | translate }}"
  >
    <label class="main-switch" for="schedule-view-mode-toggle">
      <input
        type="checkbox"
        id="schedule-view-mode-toggle"
        name="scheduleViewModeToggle"
        aria-labelledby="schedule-view-mode-toggle-label"
        [checked]="isTimelineMode()"
        (change)="onViewModeToggleChanged($any($event.target).checked)"
      />
      <div class="slider round"></div>
    </label>
  </div>

  @if (isTimelineMode()) {
    <div ngbDropdown container="body" class="timeline-range-selector">
      <button
        id="timeline-range-dropdown"
        class="btn btn-sm timeline-range-btn"
        ngbDropdownToggle
        type="button"
      >
        {{
          "schedule.toolbar.timeline-range." + timelineViewRange() | translate
        }}
      </button>
      <div ngbDropdownMenu aria-labelledby="timeline-range-dropdown">
        <button ngbDropdownItem (click)="onTimelineRangeChange('full')">
          {{ "schedule.toolbar.timeline-range.full" | translate }}
        </button>
        <button ngbDropdownItem (click)="onTimelineRangeChange('day')">
          {{ "schedule.toolbar.timeline-range.day" | translate }}
        </button>
      </div>
    </div>
  }

  <span class="filler"></span>

  <div class="custom-slider">
    @if (!isTimelineMode()) {
      <ngx-slider
        id="schedule-zoom-slider"
        [(value)]="value"
        (valueChange)="onChange()"
        [options]="options"
      ></ngx-slider>
    } @else {
      <ngx-slider
        id="schedule-timeline-row-height-slider"
        [(value)]="timelineValue"
        (valueChange)="onTimelineRowHeightChange()"
        [options]="timelineOptions"
      ></ngx-slider>
    }
  </div>
</div>
