<!-- eslint-disable @angular-eslint/template/interactive-supports-focus -->
<!-- eslint-disable @angular-eslint/template/click-events-have-key-events -->
<form>
  <div class="modal-header">
    <div class="container-header-modal modal-title" id="modal-title2">
      {{
        "address.edit-address.address-persona.modal-new-address-typ.header"
          | translate
      }}
    </div>
  </div>
  <div class="modal-body first-modal">
    <div class="form-group">
      <label for="newAddressValidFrom">{{
        "address.edit-address.address-persona.modal-new-address-typ.valid"
          | translate
      }}</label>

      <div class="input-group">
        <input
          id="newAddressValidFrom"
          class="form-control"
          name="newAddressValidFrom"
          [ngModel]="dialogs.newAddressValidFrom"
          [attr.aria-label]="'address.edit-address.address-persona.modal-new-address-typ.valid' | translate"
          (ngModelChange)="dialogs.newAddressValidFrom = $event"
          ngbDatepicker
          #newAddressValidFrom1="ngbDatepicker"
        />

        <span
          class="input-group-text"
          style="width: 40px"
          (click)="newAddressValidFrom1.toggle()"
        >
          <fa-icon
            [icon]="faCalendar"
            [style]="{ 'font-size': '16px', color: '#464e5f' }"
          ></fa-icon>
        </span>
      </div>
    </div>

    @if (dialogs.allowedAddressTypes.length > 1) {
    <div class="form-group">
      <label for="newAddressType">{{
        "address.edit-address.address-persona.modal-new-address-typ.type"
          | translate
      }}</label>
      <select
        id="newAddressType"
        class="form-select"
        [(ngModel)]="dialogs.newAddressType"
        name="newAddressType"
        [attr.aria-label]="'address.edit-address.address-persona.modal-new-address-typ.type' | translate"
      >
        @for (type of dialogs.allowedAddressTypes; track type) {
        <option [ngValue]="type">
          {{ dialogs.onAddressTypeName(type) }}
        </option>
        }
      </select>
    </div>
    }
  </div>
</form>

<div class="modal-footer">
  <span
    id="modal-cancel-new-address"
    type="button"
    class="link-button red-font"
    (click)="modal().dismiss('Cancel click')"
    >{{ "cancel" | translate }}</span
  >
  <button id="modal-save-new-address" type="button" class="btn ownStyle-add" (click)="modal().close()">
    {{
      "address.edit-address.address-persona.modal-new-address-typ.add"
        | translate
    }}
  </button>
</div>
