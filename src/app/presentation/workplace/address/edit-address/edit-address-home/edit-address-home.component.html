<div class="container-edit-address">
  <div class="container-headline">
    {{ "address.edit-address.home.header" | translate }}
  </div>

  <div class="container-profilline">
    <app-address-persona
      (isChangingEvent)="onIsChanging($event)"
      class="container-profile first border-right-card border-bottom-card"
    ></app-address-persona>
  </div>

  <div class="container-profilline">
    <app-membership
      (isChangingEvent)="onIsChanging($event)"
      class="container-profile first border-right-card border-bottom-card"
      (click)="dataManagementClientService.clientEditService.currentAnnotationIndex.set(-1)"
    >
    </app-membership>
  </div>

  @if (dataManagementClientService.editClient()?.type !== 2) {
  <div class="container-profilline">
    <app-client-contracts
      (isChangingEvent)="onIsChanging($event)"
      class="container-profile first border-right-card border-bottom-card"
    >
    </app-client-contracts>
  </div>

  <div class="container-profilline">
    <app-client-groups
      (isChangingEvent)="onIsChanging($event)"
      class="container-profile first border-right-card border-bottom-card"
    >
    </app-client-groups>
  </div>
  }

  <div class="container-profilline">
    <app-note
      (isChangingEvent)="onIsChanging($event)"
      class="container-profile first border-right-card border-bottom-card"
    >
    </app-note>
  </div>

  @if (authorizationService.isAuthorised) {
  <div class="container-address-nav border-right-card border-bottom-card">
    <app-edit-address-nav></app-edit-address-nav>
  </div>
  }
</div>
<div class="bottom-border-space"></div>
