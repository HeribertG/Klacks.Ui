<form #imageForm="ngForm">
  <app-expandable-card
    [headerTitle]="translate.instant('address.edit-address.client-image.headline')">

  <div>
    @if (isLoading()) {
    <div class="loading-spinner">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
    } @if (imageUrl() && !isLoading()) {
    <div class="image-container-show">
      <img [src]="imageUrl()" alt="Client Image" class="client-image" />

      <div class="row">
        <span
          class="delete-button delete-button-icon"
          type="button"
          (click)="onClickDeleteImage()"
        >
          {{
            translate.instant("address.edit-address.client-image.remove-image")
          }}
        </span>
      </div>
    </div>
    } @if (!imageUrl() && !isLoading()) {
    <div
      class="image-container"
      [ngbTooltip]="
        translate.instant('address.edit-address.client-image.tooltip')
      "
      autoClose="true"
    >
      <label class="first">
        {{ translate.instant("address.edit-address.client-image.label") }}
      </label>

      <div
        class="fileupload-image"
        appDragDropFileUpload
        (click)="fileField.click()"
        (fileDropped)="onUploadImage($event)"
      >
        <span class="ddinfo">
          {{ translate.instant("address.edit-address.client-image.info") }}
        </span>
        <input
          type="file"
          name="clientImage"
          #fileField
          (change)="onUploadImage1($event)"
          hidden
          accept="image/*"
        />
      </div>
    </div>
    }
  </div>

  </app-expandable-card>
</form>
