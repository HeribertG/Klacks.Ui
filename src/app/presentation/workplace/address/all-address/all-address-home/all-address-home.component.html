<div
  id="address-home-container"
  class="container-dashboard"
  data-klacksy-target="addresses"
  data-klacksy-label-key="nav.addresses"
  data-klacksy-category="data.people"
  data-klacksy-route="/workplace/client"
>
  <div id="address-home-headline" class="container-headline">
    {{ "address.all-address.all-address-home.header" | translate }}
    <app-nav-toggle
      id="address-nav-toggle"
      [(open)]="navOpen"
      [filterActive]="isFilterActive()"
    ></app-nav-toggle>
  </div>

  <div
    id="address-nav"
    class="container-address-nav nav-collapsible border-right-card border-bottom-card"
    [class.nav-open]="navOpen()"
  >
    <app-all-address-nav></app-all-address-nav>
  </div>

  <div class="container-profilline">
    <app-all-address-list
      class="container-profile first border-right-card border-bottom-card"
    ></app-all-address-list>
  </div>

  <div class="bottom-border-space"></div>
</div>
