<!-- eslint-disable @angular-eslint/template/interactive-supports-focus -->
<!-- eslint-disable @angular-eslint/template/click-events-have-key-events -->
<form id="navClientForm">
  <ul class="list-group">
    <li class="list-group-item-action">
      <label class="checkbox-label">
        <input
          id="filter-female"
          type="checkbox"
          [formField]="navFilterForm.female"
        />
        {{ "female" | translate }}
      </label>

      <label class="checkbox-label">
        <input
          id="filter-male"
          type="checkbox"
          [formField]="navFilterForm.male"
        />
        {{ "male" | translate }}
      </label>

      <label class="checkbox-label">
        <input
          id="filter-intersexuality"
          type="checkbox"
          [formField]="navFilterForm.intersexuality"
        />
        {{ "intersexuality" | translate }}
      </label>

      <label class="checkbox-label">
        <input
          id="filter-legal-entity"
          type="checkbox"
          [formField]="navFilterForm.legalEntity"
        />
        {{ "legal-entity" | translate }}
      </label>
    </li>

    <!-- Typ -->
    <li class="list-group-item-action">
      <div ngbDropdown (openChange)="onOpenChange($event)">
        <button
          class="btn btn-outline-primary btn-sm max-width"
          id="dropdownForm-0"
          ngbDropdownToggle
          [disabled]="!isRequestPossible()"
        >
          {{ "address.edit-address.membership.type" | translate }}
        </button>
        <div ngbDropdownMenu aria-labelledby="dropdownForm-0">
          <div class="form-group">
            <div class="checkbox-container-default">
              <label class="checkbox-label">
                <input
                  id="filter-type-employee"
                  type="checkbox"
                  [formField]="navFilterForm.employee"
                />
                {{
                  "address.edit-address.membership.type.employee" | translate
                }}
              </label>

              <label class="checkbox-label">
                <input
                  id="filter-type-extern-emp"
                  type="checkbox"
                  [formField]="navFilterForm.externEmp"
                />
                {{
                  "address.edit-address.membership.type.externEmp" | translate
                }}
              </label>

              <label class="checkbox-label">
                <input
                  id="filter-type-customer"
                  type="checkbox"
                  [formField]="navFilterForm.customer"
                />
                {{
                  "address.edit-address.membership.type.customer" | translate
                }}
              </label>
            </div>
          </div>
          <div class="dropdown-divider"></div>
          <button id="close-type-dropdown" ngbDropdownItem>{{ "close" | translate }}</button>
        </div>
      </div>
    </li>

    <!-- Gültigkeit -->
    <li class="list-group-item-action">
      <div ngbDropdown (openChange)="onOpenChange($event)">
        <button
          class="btn btn-outline-primary btn-sm max-width"
          id="dropdownForm-1"
          ngbDropdownToggle
          [disabled]="!isRequestPossible()"
        >
          {{ "address.all-address.all-address-nav.validity" | translate }}
        </button>
        <div ngbDropdownMenu aria-labelledby="dropdownForm-1">
          <div class="form-group">
            <div class="checkbox-container-default">
              <label class="checkbox-label">
                <input
                  id="filter-active-membership"
                  type="checkbox"
                  [formField]="navFilterForm.activeMembership"
                />
                {{ "active" | translate }}
              </label>

              <label class="checkbox-label">
                <input
                  id="filter-former-membership"
                  type="checkbox"
                  [formField]="navFilterForm.formerMembership"
                />
                {{ "alumni" | translate }}
              </label>

              <label class="checkbox-label">
                <input
                  id="filter-future-membership"
                  type="checkbox"
                  [formField]="navFilterForm.futureMembership"
                />
                {{ "future" | translate }}
              </label>
            </div>
          </div>
          <div class="dropdown-divider"></div>
          <button id="close-validity-dropdown" ngbDropdownItem>{{ "close" | translate }}</button>
        </div>
      </div>
    </li>

    <!-- Länder -->
    <li class="list-group-item-action">
      <div ngbDropdown (openChange)="onOpenChange($event)">
        <button
          class="btn btn-outline-primary btn-sm max-width"
          id="dropdownForm-2"
          ngbDropdownToggle
          [disabled]="!isRequestPossible()"
        >
          {{
            "address.all-address.all-address-nav.choose-countries" | translate
          }}
        </button>
        <div ngbDropdownMenu>
          <div class="px-4 py-3">
            <div class="form-group">
              <button
                id="filter-select-all-countries"
                type="button"
                class="btn btn-secondary btn-sm max-width2"
                (click)="
                  dataManagementClientService.currentFilter.selectCountries(
                    true
                  )
                "
              >
                {{ "selecting" | translate }}
              </button>
              <p></p>
              <button
                id="filter-deselect-all-countries"
                type="button"
                class="btn btn-secondary btn-sm max-width2"
                (click)="
                  dataManagementClientService.currentFilter.selectCountries(
                    false
                  )
                "
              >
                {{ "deselecting" | translate }}
              </button>
            </div>
          </div>
          <div class="dropdown-divider"></div>
          <div class="form-group">
            <div class="checkbox-container-default2">
              @for (c of dataManagementClientService.currentFilter.countries;
              track c) {
              <label class="checkbox-label">
                <input
                  type="checkbox"
                  [ngModel]="c.select"
                  [ngModelOptions]="{ standalone: true }"
                  (ngModelChange)="c.select = $event"
                  (change)="
                    dataManagementClientService.currentFilter.resetFilteredStateToken()
                  "
                />
                {{ c.name | fallback : currentLang }}
              </label>
              }
            </div>
          </div>
          <div class="dropdown-divider"></div>
          <button id="close-countries-dropdown" ngbDropdownItem>{{ "close" | translate }}</button>
        </div>
      </div>
    </li>

    <!-- Kantone -->
    <li class="list-group-item-action">
      <div ngbDropdown (openChange)="onOpenChange($event)">
        <button
          class="btn btn-outline-primary btn-sm max-width"
          id="dropdownForm1"
          ngbDropdownToggle
          [disabled]="!isRequestPossible()"
        >
          {{ "address.all-address.all-address-nav.choose-cantons" | translate }}
        </button>
        <div ngbDropdownMenu>
          <div class="px-4 py-3">
            <div class="form-group">
              <button
                id="filter-select-all-states"
                type="button"
                class="btn btn-secondary btn-sm max-width"
                (click)="
                  dataManagementClientService.currentFilter.selectState(true)
                "
              >
                {{ "selecting" | translate }}
              </button>
              <p></p>
              <button
                id="filter-deselect-all-states"
                type="button"
                class="btn btn-secondary btn-sm max-width"
                (click)="
                  dataManagementClientService.currentFilter.selectState(false)
                "
              >
                {{ "deselecting" | translate }}
              </button>
            </div>
          </div>

          @if (dataManagementClientService.currentFilter.filteredStateToken) {
          <div class="form-group">
            <div class="checkbox-container">
              @for (item of
              dataManagementClientService.currentFilter.filteredStateToken;
              track item) {
              <label
                class="checkbox-label"
                placement="right"
                ngbTooltip="{{ item.stateName | fallback : currentLang }}"
              >
                <input
                  type="checkbox"
                  [(ngModel)]="item.select"
                  [ngModelOptions]="{ standalone: true }"
                  (change)="
                    dataManagementClientService.currentFilter.setFilteredStateToken(
                      item
                    )
                  "
                />
                {{ item.state }} ({{ item.country }})
              </label>
              }
            </div>
          </div>
          }

          <div class="dropdown-divider"></div>
          <button id="close-states-dropdown" ngbDropdownItem>{{ "close" | translate }}</button>
        </div>
      </div>
    </li>

    <!--Scope -->
    <li class="list-group-item-action">
      <div ngbDropdown (openChange)="onOpenChange($event)">
        <button
          class="btn btn-outline-primary btn-sm max-width"
          id="dropdownForm4"
          ngbDropdownToggle
          [disabled]="!isRequestPossible()"
        >
          {{ "address.all-address.all-address-nav.date-range" | translate }}
        </button>
        <div ngbDropdownMenu>
          <div class="form-group">
            <div class="checkbox-container-default3">
              <div class="row-line-simple">
                <label class="checkbox-label">
                  <input
                    type="checkbox"
                    [formField]="navFilterForm.scopeFromFlag"
                    id="scopeFromFlag"
                  />
                  {{ "address.all-address.all-address-nav.entry" | translate }}
                </label>
                <label class="checkbox-label">
                  <input
                    type="checkbox"
                    [formField]="navFilterForm.scopeUntilFlag"
                    id="scopeUntilFlag"
                  />
                  {{
                    "address.all-address.all-address-nav.resignation"
                      | translate
                  }}
                </label>
              </div>

              <div>
                <label for="billsFrom">{{
                  "address.all-address.all-address-nav.from" | translate
                }}</label>
                <div class="input-group my-datepicker">
                  <input
                    id="filter-date-from"
                    class="form-control"
                    name="from"
                    aria-label="from"
                    [ngModel]="scopeFromValue"
                    (ngModelChange)="onScopeFromChange($event)"
                    ngbDatepicker
                    #from="ngbDatepicker"
                  />
                  <span
                    class="input-group-text"
                    style="width: 40px"
                    (click)="from.toggle()"
                  >
                    <fa-icon
                      [icon]="faCalendar"
                      [style]="{ 'font-size': '16px', color: '#464e5f' }"
                    ></fa-icon>
                  </span>
                </div>

                <label for="billsFrom">{{
                  "address.all-address.all-address-nav.until" | translate
                }}</label>
                <div class="input-group my-datepicker">
                  <input
                    id="filter-date-until"
                    class="form-control"
                    name="until"
                    aria-label="until"
                    [ngModel]="scopeUntilValue"
                    (ngModelChange)="onScopeUntilChange($event)"
                    ngbDatepicker
                    #until="ngbDatepicker"
                  />
                  <span
                    class="input-group-text"
                    style="width: 40px"
                    (click)="until.toggle()"
                  >
                    <fa-icon
                      [icon]="faCalendar"
                      [style]="{ 'font-size': '16px', color: '#464e5f' }"
                    ></fa-icon>
                  </span>
                </div>
              </div>
            </div>
          </div>

          <div class="dropdown-divider"></div>
          <button id="close-scope-dropdown" ngbDropdownItem>{{ "close" | translate }}</button>
        </div>
      </div>
    </li>

    <!-- Gelöschte Adressen -->
    <li class="list-group-item-action">
      <label class="checkbox-label">
        <input
          id="filter-show-deleted"
          type="checkbox"
          [formField]="navFilterForm.showDeleteEntries"
        />
        {{ "address.all-address.all-address-nav.remove-address" | translate }}
      </label>
    </li>

    <li class="list-group-item-action">
      <button
        id="filter-reset-button"
        class="btn btn btn-sm max-width place-around"
        (click)="onClickSetEmpty()"
        [disabled]="
          dataManagementClientService.currentFilter.emptyPlaceholder()
        "
      >
        {{ "address.all-address.all-address-nav.reset-filter" | translate }}
      </button>
    </li>
  </ul>
</form>
