<ng-template #standInCreateModal>
  <div class="modal-header">
    <div class="container-header-modal modal-title" id="stand-in-create-title">
      {{ "standIn.create.title" | translate }} – <span id="stand-in-create-group-name">{{ groupName() }}</span>
    </div>
  </div>

  <div class="modal-body" aria-labelledby="stand-in-create-title">
    <p class="dialog-hint">{{ "standIn.create.hint" | translate }}</p>

    <div class="form-row">
      <div class="form-group count-field">
        <label for="stand-in-create-count">{{ "standIn.create.count" | translate }} *</label>
        <input
          id="stand-in-create-count"
          type="number"
          class="form-control"
          [formField]="textForm.count"
        />
      </div>

      <div class="form-group pattern-field">
        <label for="stand-in-create-pattern">{{ "standIn.create.namePattern" | translate }} *</label>
        <input
          id="stand-in-create-pattern"
          type="text"
          class="form-control"
          autocomplete="off"
          [placeholder]="'standIn.create.namePatternExample' | translate"
          [formField]="textForm.namePattern"
        />
      </div>
    </div>

    <div class="form-row">
      <app-date-input
        [label]="'standIn.create.validFrom' | translate"
        inputId="stand-in-create-valid-from"
        inputName="standInValidFrom"
        [value]="validFrom()"
        (valueChange)="validFrom.set($event ?? null)"
      ></app-date-input>
      <app-date-input
        [label]="'standIn.create.validUntil' | translate"
        inputId="stand-in-create-valid-until"
        inputName="standInValidUntil"
        [value]="validUntil()"
        (valueChange)="validUntil.set($event ?? null)"
      ></app-date-input>
    </div>

    <div class="form-group">
      <label for="stand-in-create-qualifications">{{ "standIn.create.qualifications" | translate }}</label>
      <app-stand-in-qualification-select
        [qualifications]="qualifications()"
        [selectedIds]="selectedQualificationIds()"
        [lang]="currentLang"
        (toggled)="onToggleQualification($event)"
      />
    </div>

    @if (problem(); as message) {
      <div id="stand-in-create-problem" class="dialog-problem" role="alert">
        {{ message.key | translate: message.params }}
      </div>
    }
  </div>

  <div class="modal-footer">
    <button id="stand-in-create-cancel" type="button" class="btn link-button red-font" (click)="onCancel()">
      {{ "cancel" | translate }}
    </button>
    <button
      id="stand-in-create-submit"
      type="button"
      class="btn save-btn"
      [disabled]="isSaving()"
      (click)="onCreate()"
    >
      {{ "standIn.create.submit" | translate }}
    </button>
  </div>
</ng-template>
