<div
  ngbDropdown
  autoClose="outside"
  placement="top-start bottom-start"
  class="qualification-select"
  (openChange)="onOpenChange($event)"
>
  <button
    id="stand-in-create-qualifications"
    type="button"
    class="form-control qualification-select-toggle"
    ngbDropdownToggle
    [attr.title]="chosenNames() || null"
    [attr.aria-label]="
      ('standIn.create.qualifications' | translate) +
      ': ' +
      (chosenNames() || ('standIn.create.qualificationsPlaceholder' | translate))
    "
  >
    @if (chosen().length === 0) {
      <span class="qualification-select-placeholder">{{ "standIn.create.qualificationsPlaceholder" | translate }}</span>
    } @else {
      <span class="qualification-select-symbols">
        @for (option of visibleChosen(); track option.id) {
          @if (option.emoji) {
            <span class="qualification-select-symbol" [attr.data-qualification-id]="option.id">{{ option.emoji }}</span>
          } @else {
            <span class="qualification-select-short-name" [attr.data-qualification-id]="option.id">{{ option.name }}</span>
          }
        }
        @if (hiddenCount() > 0) {
          <span class="qualification-select-more">+{{ hiddenCount() }}</span>
        }
      </span>
    }
  </button>
  <div ngbDropdownMenu id="stand-in-create-qualifications-menu" class="qualification-select-menu">
    @if (hasSearch()) {
      <div class="qualification-select-search">
        <input
          #search
          id="stand-in-create-qualifications-search"
          type="search"
          class="form-control form-control-sm"
          autocomplete="off"
          [placeholder]="'placeholder.search-qualification' | translate"
          [attr.aria-label]="'placeholder.search-qualification' | translate"
          [value]="searchText()"
          (input)="searchText.set(search.value)"
        />
      </div>
    }
    <div class="qualification-select-list">
      @for (option of filteredOptions(); track option.id) {
        <label class="dropdown-item qualification-select-option" [id]="'stand-in-create-qualification-' + option.id">
          <input
            type="checkbox"
            ngbDropdownItem
            class="qualification-select-checkbox"
            [checked]="isChosen(option.id)"
            (change)="onToggle(option.id)"
          />
          <span class="qualification-select-option-symbol">{{ option.emoji }}</span>
          <span class="qualification-select-option-name" [attr.title]="option.name">{{ option.name }}</span>
        </label>
      }
      @if (options().length === 0) {
        <span class="dropdown-item-text empty-hint">{{ "standIn.create.noQualifications" | translate }}</span>
      }
    </div>
  </div>
</div>
