<div id="profile-home-container" class="container-dashboard">
  <div id="profile-home-headline" class="container-headline">
    {{ "setting.home.header" | translate }}
  </div>

  <div id="profile-home-upper-row" class="container-profilline">
    <app-profile-picture
      id="profile-picture"
      class="container-profile-small container-profile-login container-profile-login-margin first border-right-card border-bottom-card"
    ></app-profile-picture>
    <app-profile-data-edit
      id="profile-data-edit"
      class="container-profile-small container-profile-login border-right-card border-bottom-card"
      (isChangingEvent)="onIsChanging($event)"
    ></app-profile-data-edit>
  </div>
  <div id="profile-home-lower-row" class="container-profilline">
    <app-profile-custom-setting
      id="profile-custom-setting"
      class="container-profile-small container-profile-login-margin first border-right-card border-bottom-card"
    >
    </app-profile-custom-setting>
    <app-profile-microphone-test
      id="profile-microphone-test"
      class="container-profile-small container-profile-login-margin border-right-card border-bottom-card"
    >
    </app-profile-microphone-test>
  </div>

  <div class="bottom-border-space"></div>
</div>
