<div class="availability-header">
  <div class="header-left">
    <div class="view-mode-group" ngbDropdown>
      <button class="btn btn-sm btn-outline-secondary" ngbDropdownToggle>
        @switch (viewMode) {
          @case (PaymentInterval.Weekly) { {{ "client-availability.view-mode.week" | translate }} }
          @case (PaymentInterval.Biweekly) { {{ "client-availability.view-mode.biweekly" | translate }} }
          @case (PaymentInterval.Monthly) { {{ "client-availability.view-mode.monthly" | translate }} }
        }
      </button>
      <div ngbDropdownMenu>
        <button ngbDropdownItem (click)="setViewMode(PaymentInterval.Weekly)">{{ "client-availability.view-mode.week" | translate }}</button>
        <button ngbDropdownItem (click)="setViewMode(PaymentInterval.Biweekly)">{{ "client-availability.view-mode.biweekly" | translate }}</button>
        <button ngbDropdownItem (click)="setViewMode(PaymentInterval.Monthly)">{{ "client-availability.view-mode.monthly" | translate }}</button>
      </div>
    </div>

  </div>

  <div class="header-center">
    <span class="period-label">{{ periodLabel() }}</span>
  </div>

  <div class="header-right">
    <div class="grouping-slider">
      <ngx-slider [(value)]="hourGrouping" [options]="groupingOptions"></ngx-slider>
    </div>

    <button
      class="btn btn-sm btn-primary save-btn"
      (click)="onSave()"
      [ngbTooltip]="'common.save' | translate">
      <i class="bi bi-floppy"></i>
      {{ 'common.save' | translate }}
    </button>
  </div>
</div>
