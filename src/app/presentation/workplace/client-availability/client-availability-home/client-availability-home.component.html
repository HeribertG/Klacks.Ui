<div class="availability-main-header">
  <app-client-availability-header
    #header
    (saveRequested)="onSaveRequested()"
    [viewMode]="viewMode"
    (periodChanged)="onPeriodChanged($event)">
  </app-client-availability-header>
</div>
<div class="availability-body">
  <app-client-availability-container
    #container>
  </app-client-availability-container>
</div>
