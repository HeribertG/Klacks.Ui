<div class="container-dashboard-card">
  @if (isLoading()) {
    <div class="container-dashboard-loading">
      <p>{{ 'dashboard.clients.loading' | translate }}</p>
    </div>
  }

  @if (error()) {
    <div class="container-dashboard-error">
      <p class="container-dashboard-error-message">{{ error() }}</p>
    </div>
  }

  @if (!isLoading() && !error()) {
    @if (chartData().length === 0) {
      <div class="container-dashboard-no-data">
        <p>{{ 'dashboard.clients.noData' | translate }}</p>
      </div>
    } @else {
      <div class="container-dashboard-card-header">
        <h3>{{ 'dashboard.clients.byGroup' | translate }}</h3>
      </div>

      <div class="container-dashboard-card-content">
        <app-pie-chart
          [data]="chartData()"
          [width]="500"
          [height]="500"
        ></app-pie-chart>
      </div>
    }
  }
</div>
