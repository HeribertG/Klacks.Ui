@if (isOpen()) {
  <div class="context-menu" [style.left.px]="x()" [style.top.px]="y()">
    @if (mergeService.canMerge()) {
      <button class="context-menu-item" (click)="onMerge()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="8" r="5"/>
          <circle cx="16" cy="16" r="5"/>
        </svg>
        {{ 'floor-plan.contextmenu.merge' | translate }}
      </button>
    }
    @if (joinService.canJoin()) {
      <button class="context-menu-item" (click)="onJoin()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 3H6a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h4"/>
          <polyline points="15 17 20 12 15 7"/>
          <line x1="20" y1="12" x2="9" y2="12"/>
        </svg>
        {{ 'floor-plan.contextmenu.join' | translate }}
      </button>
    }
  </div>
}
