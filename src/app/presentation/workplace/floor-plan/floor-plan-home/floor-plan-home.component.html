<div
  id="floor-plan-home-container"
  class="container-dashboard"
  data-klacksy-target="floor-plan"
  data-klacksy-label-key="nav.floorPlan"
  data-klacksy-category="data.organization"
  data-klacksy-route="/workplace/floor-plan"
>
  <div id="floor-plan-home-headline" class="container-headline">
    {{ 'floor-plan.title' | translate }}
  </div>

  <div class="container-profilline">
    <app-floor-plan-list
      class="container-profile first border-right-card border-bottom-card"
      [floorPlans]="dataManagement.floorPlans()"
      [isLoading]="dataManagement.isLoading()"
      [selectedFloorPlanId]="dataManagement.selectedFloorPlan()?.id ?? null"
      [display]="display()"
      [date]="selectedDate()"
      (selectFloorPlan)="onSelectFloorPlan($event)"
      (displayChange)="onDisplayChange($event)"
      (dateChange)="onDateChange($event)"
    />
  </div>

  @if (dataManagement.selectedFloorPlan(); as selected) {
    <div class="container-profilline">
      <div
        class="container-profile first border-right-card border-bottom-card floor-plan-viewer"
      >
        <div class="container-header header-container">
          <div class="view-mode-tabs" role="tablist">
            <button
              type="button"
              class="view-tab"
              [class.active]="viewMode() === 'view'"
              (click)="onViewModeChange('view')"
              role="tab"
            >
              {{ 'floor-plan.view.tab-view' | translate }}
            </button>
            <button
              type="button"
              class="view-tab"
              [class.active]="viewMode() === 'print'"
              (click)="onViewModeChange('print')"
              role="tab"
            >
              {{ 'floor-plan.view.tab-print' | translate }}
            </button>
          </div>

          <span class="floor-plan-plan-name">{{ selected.name }}</span>

          @if (isLoadingWorks()) {
            <div class="spinner-border spinner-border-sm" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          }

          <span class="filler"></span>

          @if (viewMode() === 'print') {
            <div class="print-controls">
              <div class="btn-group btn-group-sm" role="group">
                <button
                  type="button"
                  class="btn btn-outline-secondary"
                  [class.active]="printOrientation() === 'landscape'"
                  (click)="onOrientationChange('landscape')"
                  [title]="'floor-plan.print.landscape' | translate"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
                    <rect x="1" y="4" width="14" height="8" rx="1" ry="1" stroke="currentColor" stroke-width="1" fill="none"/>
                  </svg>
                </button>
                <button
                  type="button"
                  class="btn btn-outline-secondary"
                  [class.active]="printOrientation() === 'portrait'"
                  (click)="onOrientationChange('portrait')"
                  [title]="'floor-plan.print.portrait' | translate"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
                    <rect x="4" y="1" width="8" height="14" rx="1" ry="1" stroke="currentColor" stroke-width="1" fill="none"/>
                  </svg>
                </button>
              </div>
              <button
                type="button"
                class="btn btn-sm btn-primary floor-plan-print-btn"
                (click)="onPrint()"
              >
                {{ 'floor-plan.print.print' | translate }}
              </button>
            </div>
          }

          <span class="floor-plan-zoom-label">
            {{ 'floor-plan.toolbar.zoom' | translate }}
          </span>
          <div class="custom-slider">
            <ngx-slider
              id="floor-plan-zoom-slider"
              [(value)]="zoomValue"
              (valueChange)="onZoomSliderChange()"
              [options]="zoomOptions"
            ></ngx-slider>
          </div>
        </div>
        <div class="container-line"></div>
        <div
          class="floor-plan-viewer-canvas-area"
          [class.print-mode]="viewMode() === 'print'"
        >
          @if (viewMode() === 'view') {
            <app-floor-plan-canvas />
          } @else {
            <app-floor-plan-print-preview
              [svgContent]="printSvgContent()"
              [zoom]="zoomValue / 100"
              [orientation]="printOrientation()"
            />
          }
        </div>
      </div>
    </div>
  }

  <div class="bottom-border-space"></div>
</div>
