<div class="floor-plan-toolbar">

  <input
    #importFileRef
    type="file"
    accept=".svg,.dxf,.png,.jpg,.jpeg,.gif,.bmp,.webp"
    class="d-none"
    (change)="onImportFile($event)"
  />

  <div class="toolbar-group">
    <button class="toolbar-btn" (click)="onImportClick()" [title]="'floor-plan.toolbar.import' | translate">
      <app-icon-fp-import />
    </button>
  </div>

  <div class="toolbar-separator"></div>

  <div class="toolbar-group">
    <button
      class="toolbar-btn"
      [class.active]="isToolActive(FloorPlanTool.Select)"
      (click)="onSelectTool(FloorPlanTool.Select)"
      [title]="'floor-plan.toolbar.select' | translate"
    >
      <app-icon-fp-select />
    </button>
    <button
      class="toolbar-btn"
      [class.active]="isToolActive(FloorPlanTool.Pan)"
      (click)="onSelectTool(FloorPlanTool.Pan)"
      [title]="'floor-plan.toolbar.pan' | translate"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="var(--iconStandartColor)">
        <path d="M10 5.5a2 2 0 1 1 4 0V9h1.5a2 2 0 0 1 2 2v3.586l.707.707a1 1 0 0 1 0 1.414l-3 3a1 1 0 0 1-1.414 0L10.5 16.414 7.207 13.12a1 1 0 0 1 0-1.414l.5-.5A1 1 0 0 1 9 11.5V9h-.5a2 2 0 0 1-2-2V5.5z" opacity="0.3"/>
        <path d="M12 2a1 1 0 0 1 1 1v6h2V7a1 1 0 0 1 2 0v5l2.293-2.293a1 1 0 0 1 1.414 1.414L16 15.828l-4 4-4.707-4.707a1 1 0 0 1 1.414-1.414L11 15.828V3a1 1 0 0 1 1-1z"/>
      </svg>
    </button>
  </div>

  <div class="toolbar-separator"></div>

  <div class="toolbar-group">
    <button
      class="toolbar-btn"
      [class.active]="isToolActive(FloorPlanTool.Line)"
      (click)="onSelectTool(FloorPlanTool.Line)"
      [title]="'floor-plan.toolbar.line' | translate"
    >
      <app-icon-fp-line />
    </button>
    <button
      class="toolbar-btn"
      [class.active]="isToolActive(FloorPlanTool.Connector)"
      (click)="onSelectTool(FloorPlanTool.Connector)"
      [title]="'floor-plan.toolbar.connector' | translate"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--iconStandartColor)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="6" cy="6" r="3"/>
        <circle cx="18" cy="18" r="3"/>
        <path d="M6 9v1a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V9"/>
        <path d="M9 18h1a2 2 0 0 0 2-2v-2a2 2 0 0 1 2-2h2"/>
      </svg>
    </button>
    @if (isToolActive(FloorPlanTool.Connector)) {
      <div class="toolbar-connector-options">
        <button
          class="toolbar-btn"
          [class.active]="toolService.connectorRouting() === ConnectorRoutingType.Straight"
          (click)="onRoutingChange(ConnectorRoutingType.Straight)"
          title="Straight"
        >⟶</button>
        <button
          class="toolbar-btn"
          [class.active]="toolService.connectorRouting() === ConnectorRoutingType.Curved"
          (click)="onRoutingChange(ConnectorRoutingType.Curved)"
          title="Curved"
        >⌒</button>
        <button
          class="toolbar-btn"
          [class.active]="toolService.connectorRouting() === ConnectorRoutingType.SCurve"
          (click)="onRoutingChange(ConnectorRoutingType.SCurve)"
          title="S-Curve"
        >
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M 2 16 C 6 16, 6 4, 10 10 C 14 16, 14 4, 18 4"
                  stroke="var(--iconStandartColor)" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <button
          class="toolbar-btn"
          [class.active]="toolService.connectorRouting() === ConnectorRoutingType.Orthogonal"
          (click)="onRoutingChange(ConnectorRoutingType.Orthogonal)"
          title="Orthogonal"
        >
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M 2 16 L 8 16 L 8 10 L 12 10 L 12 4 L 18 4"
                  stroke="var(--iconStandartColor)" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="toolbar-separator-sm"></div>
        <button
          class="toolbar-btn"
          [class.active]="toolService.connectorArrowhead() === ConnectorArrowheadType.Single"
          (click)="onArrowheadChange(ConnectorArrowheadType.Single)"
          title="Single arrowhead"
        >→</button>
        <button
          class="toolbar-btn"
          [class.active]="toolService.connectorArrowhead() === ConnectorArrowheadType.Double"
          (click)="onArrowheadChange(ConnectorArrowheadType.Double)"
          title="Double arrowhead"
        >←→</button>
      </div>
    }
    <button
      class="toolbar-btn"
      [class.active]="isToolActive(FloorPlanTool.Rectangle)"
      (click)="onSelectTool(FloorPlanTool.Rectangle)"
      [title]="'floor-plan.toolbar.rectangle' | translate"
    >
      <app-icon-fp-rectangle />
    </button>
    <button
      class="toolbar-btn"
      [class.active]="isToolActive(FloorPlanTool.Circle)"
      (click)="onSelectTool(FloorPlanTool.Circle)"
      [title]="'floor-plan.toolbar.circle' | translate"
    >
      <app-icon-fp-circle />
    </button>
    <button
      class="toolbar-btn"
      [class.active]="isToolActive(FloorPlanTool.Polygon)"
      (click)="onSelectTool(FloorPlanTool.Polygon)"
      [title]="'floor-plan.toolbar.polygon' | translate"
    >
      <app-icon-fp-polygon />
    </button>
    <button
      class="toolbar-btn"
      [class.active]="isToolActive(FloorPlanTool.RegularPolygon)"
      (click)="onSelectTool(FloorPlanTool.RegularPolygon)"
      [title]="'floor-plan.toolbar.regular-polygon' | translate"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M8.08113883,20 L15.9188612,20 C16.5645068,20 17.137715,19.5868549 17.3418861,18.9743416 L19.6721428,11.9835717 C19.8694432,11.3916705 19.6797482,10.7394436 19.1957765,10.3456849 L12.9561839,5.26916104 C12.4053757,4.82102426 11.6158052,4.82050247 11.0644052,5.26791085 L4.80622561,10.345825 C4.32117072,10.7394007 4.13079092,11.3923728 4.32832067,11.984962 L6.65811388,18.9743416 C6.86228495,19.5868549 7.43549322,20 8.08113883,20 Z" fill="var(--iconStandartColor)"/>
      </svg>
    </button>
    @if (isToolActive(FloorPlanTool.RegularPolygon)) {
      <div class="toolbar-connector-options">
        <label class="toolbar-label" [title]="'floor-plan.toolbar.sides' | translate">
          <select
            class="toolbar-select"
            [ngModel]="toolService.regularPolygonSides()"
            (ngModelChange)="onRegularPolygonSidesChange($event)"
          >
            @for (n of regularPolygonSideOptions; track n) {
              <option [value]="n">{{ n }}</option>
            }
          </select>
        </label>
      </div>
    }
    <button
      class="toolbar-btn"
      [class.active]="isToolActive(FloorPlanTool.FreeDrawing)"
      (click)="onSelectTool(FloorPlanTool.FreeDrawing)"
      [title]="'floor-plan.toolbar.free-drawing' | translate"
    >
      <app-icon-fp-pencil />
    </button>
    <button
      class="toolbar-btn"
      [class.active]="isToolActive(FloorPlanTool.Text)"
      (click)="onSelectTool(FloorPlanTool.Text)"
      [title]="'floor-plan.toolbar.text' | translate"
    >
      <app-icon-fp-text />
    </button>
    <button
      class="toolbar-btn"
      [class.active]="isToolActive(FloorPlanTool.Eraser)"
      (click)="onSelectTool(FloorPlanTool.Eraser)"
      [title]="'floor-plan.toolbar.eraser' | translate"
    >
      <app-icon-fp-eraser />
    </button>
    <button
      class="toolbar-btn"
      (click)="onGroupSelected()"
      [title]="'floor-plan.toolbar.group' | translate"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7"/>
        <rect x="14" y="3" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/>
        <rect x="3" y="14" width="7" height="7"/>
      </svg>
    </button>
    <button
      class="toolbar-btn"
      (click)="onUngroupSelected()"
      [title]="'floor-plan.toolbar.ungroup' | translate"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7"/>
        <rect x="14" y="3" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/>
        <rect x="3" y="14" width="7" height="7"/>
        <line x1="10" y1="6.5" x2="14" y2="6.5"/>
        <line x1="10" y1="17.5" x2="14" y2="17.5"/>
        <line x1="6.5" y1="10" x2="6.5" y2="14"/>
        <line x1="17.5" y1="10" x2="17.5" y2="14"/>
      </svg>
    </button>
    <button
      class="toolbar-btn"
      [disabled]="!mergeService.canMerge()"
      (click)="onMerge()"
      [title]="'floor-plan.toolbar.merge' | translate"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M8,9 L8,6.18181818 C8,4.76751186 8.76751186,4 10.1818182,4 L17.8181818,4 C19.2324881,4 20,4.76751186 20,6.18181818 L20,13.8181818 C20,15.2324881 19.2324881,16 17.8181818,16 L15,16 L15,18.8181818 C15,20.2324881 14.2324881,21 12.8181818,21 L5.18181818,21 C3.76751186,21 3,20.2324881 3,18.8181818 L3,11.1818182 C3,9.76751186 3.76751186,9 5.18181818,9 L8,9 Z" fill="currentColor"/>
      </svg>
    </button>
    <button
      class="toolbar-btn"
      [disabled]="!joinService.canJoin()"
      (click)="onJoin()"
      [title]="'floor-plan.toolbar.join' | translate"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M12.4644661,14.5355339 L9.46446609,14.5355339 C8.91218134,14.5355339 8.46446609,14.9832492 8.46446609,15.5355339 C8.46446609,16.0878187 8.91218134,16.5355339 9.46446609,16.5355339 L12.4644661,16.5355339 L12.4644661,17.5355339 C12.4644661,18.6401034 11.5690356,19.5355339 10.4644661,19.5355339 L6.46446609,19.5355339 C5.35989659,19.5355339 4.46446609,18.6401034 4.46446609,17.5355339 L4.46446609,13.5355339 C4.46446609,12.4309644 5.35989659,11.5355339 6.46446609,11.5355339 L10.4644661,11.5355339 C11.5690356,11.5355339 12.4644661,12.4309644 12.4644661,13.5355339 L12.4644661,14.5355339 Z" fill="currentColor" opacity="0.3" transform="translate(8.464466,15.535534) rotate(-45) translate(-8.464466,-15.535534)"/>

      </svg>
    </button>
    <button
      class="toolbar-btn"
      (click)="onEntbinden()"
      [title]="'floor-plan.toolbar.entbinden' | translate"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M11.7573593,15.2426407 L8.75735931,15.2426407 C8.20507456,15.2426407 7.75735931,15.6903559 7.75735931,16.2426407 C7.75735931,16.7949254 8.20507456,17.2426407 8.75735931,17.2426407 L11.7573593,17.2426407 L11.7573593,18.2426407 C11.7573593,19.3472102 10.8619288,20.2426407 9.75735931,20.2426407 L5.75735931,20.2426407 C4.65278981,20.2426407 3.75735931,19.3472102 3.75735931,18.2426407 L3.75735931,14.2426407 C3.75735931,13.1380712 4.65278981,12.2426407 5.75735931,12.2426407 L9.75735931,12.2426407 C10.8619288,12.2426407 11.7573593,13.1380712 11.7573593,14.2426407 L11.7573593,15.2426407 Z" fill="currentColor" opacity="0.3" transform="translate(7.757359,16.242641) rotate(-45) translate(-7.757359,-16.242641)"/>

      </svg>
    </button>
  </div>

  <div class="toolbar-separator"></div>

  <div class="toolbar-group">
    <button
      class="toolbar-btn"
      (click)="onUndo()"
      [disabled]="!canvasService.canUndo()"
      [title]="'floor-plan.toolbar.undo' | translate"
    >
      <app-icon-fp-undo />
    </button>
    <button
      class="toolbar-btn"
      (click)="onRedo()"
      [disabled]="!canvasService.canRedo()"
      [title]="'floor-plan.toolbar.redo' | translate"
    >
      <app-icon-fp-redo />
    </button>
  </div>

  <div class="toolbar-separator"></div>

  <div class="toolbar-group">
    <button class="toolbar-btn" (click)="onZoomIn()" [title]="'floor-plan.toolbar.zoom-in' | translate">
      <app-icon-fp-zoom-plus />
    </button>
    <button class="toolbar-btn" (click)="onZoomOut()" [title]="'floor-plan.toolbar.zoom-out' | translate">
      <app-icon-fp-zoom-minus />
    </button>
    <button class="toolbar-btn" (click)="onZoomFit()" [title]="'floor-plan.toolbar.zoom-fit' | translate">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
        <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
          <rect x="0" y="0" width="24" height="24"></rect>
          <path d="M4,7 L4,5 C4,4.44771525 4.44771525,4 5,4 L7,4" stroke="var(--iconStandartColor)" stroke-width="2" stroke-linecap="round"></path>
          <path d="M20,7 L20,5 C20,4.44771525 19.5522847,4 19,4 L17,4" stroke="var(--iconStandartColor)" stroke-width="2" stroke-linecap="round"></path>
          <path d="M4,17 L4,19 C4,19.5522847 4.44771525,20 5,20 L7,20" stroke="var(--iconStandartColor)" stroke-width="2" stroke-linecap="round"></path>
          <path d="M20,17 L20,19 C20,19.5522847 19.5522847,20 19,20 L17,20" stroke="var(--iconStandartColor)" stroke-width="2" stroke-linecap="round"></path>
        </g>
      </svg>
    </button>
    <button class="toolbar-btn" (click)="onZoomReset()" [title]="'floor-plan.toolbar.zoom-100' | translate">
      <span class="zoom-label">{{ (canvasService.zoom() * 100).toFixed(0) }}%</span>
    </button>
  </div>

  <div class="toolbar-separator"></div>

  <div class="toolbar-group align-items-center">
    <label class="toolbar-label" [title]="'floor-plan.toolbar.stroke-color' | translate">
      <span>S</span>
      <input
        type="color"
        class="color-picker"
        [value]="toolService.strokeColor()"
        (change)="onStrokeColorChange($event)"
      />
    </label>
    <label class="toolbar-label" [title]="'floor-plan.toolbar.fill-color' | translate">
      <span>F</span>
      <input
        type="color"
        class="color-picker"
        [value]="toolService.fillColor() === 'transparent' ? '#ffffff' : toolService.fillColor()"
        (change)="onFillColorChange($event)"
      />
    </label>
    <select
      class="toolbar-select"
      [ngModel]="toolService.strokeWidth()"
      (ngModelChange)="onStrokeWidthChange($event)"
      [title]="'floor-plan.toolbar.stroke-width' | translate"
    >
      @for (w of strokeWidths; track w) {
        <option [value]="w">{{ w }}px</option>
      }
    </select>
  </div>

  <div class="toolbar-separator"></div>

  <div class="toolbar-group align-items-center">
    <button
      class="toolbar-btn"
      [class.active]="toolService.snapEnabled()"
      (click)="onToggleSnap()"
      [title]="'floor-plan.toolbar.snap' | translate"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        <line x1="3" y1="9" x2="21" y2="9"/>
        <line x1="3" y1="15" x2="21" y2="15"/>
        <line x1="9" y1="3" x2="9" y2="21"/>
        <line x1="15" y1="3" x2="15" y2="21"/>
      </svg>
    </button>
    <select
      class="toolbar-select"
      [ngModel]="toolService.snapSize()"
      (ngModelChange)="onSnapSizeChange($event)"
      [disabled]="!toolService.snapEnabled()"
      [title]="'floor-plan.toolbar.snap-size' | translate"
    >
      @for (s of snapSizes; track s) {
        <option [value]="s">{{ s }}px</option>
      }
    </select>
  </div>

  <div class="toolbar-separator"></div>
