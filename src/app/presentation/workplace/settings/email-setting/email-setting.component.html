<div class="container-dashboard">
  <div class="container-header">Email-Settings</div>

  <div class="container-line"></div>

  <form #emailSettingsForm="ngForm" *ngIf="isDataLoaded">
    <div class="row-line">
      <div class="form-group firstColumn">
        <label for="outgoingServer">Outgoing Server</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="dataManagementSettingsService.outgoingServer"
          aria-label="outgoingServer"
          name="outgoingServer"
          id="outgoingServer"
        />
      </div>

      <div class="form-group secondColumn">
        <label for="outgoingServerPort">Outgoing Server Port</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="dataManagementSettingsService.outgoingServerPort"
          aria-label="outgoingServerPort"
          name="outgoingServerPort"
          id="outgoingServerPort"
        />
      </div>
    </div>

    <div class="row-line">
      <div class="form-group firstColumn">
        <label for="outgoingServerTimeout">Outgoing Server Timeout</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="dataManagementSettingsService.outgoingServerTimeout"
          aria-label="outgoingServerTimeout"
          name="outgoingServerTimeout"
          id="outgoingServerTimeout"
        />
      </div>

      <div class="form-group secondColumn">
        <label for="enabledSSL">Enabled SSL</label>
        <select
          type="email"
          class="form-select"
          [(ngModel)]="dataManagementSettingsService.enabledSSL"
          aria-label="enabledSSL"
          name="enabledSSL"
          id="enabledSSL"
        >
          <option
            value="true"
            [selected]="dataManagementSettingsService.enabledSSL === 'true'"
          >
            Yes
          </option>
          <option
            value="false"
            [selected]="dataManagementSettingsService.enabledSSL === 'false'"
          >
            No
          </option>
        </select>
      </div>
    </div>

    <div class="row-line">
      <div class="form-group firstColumn">
        <label for="authenticationType">Authentication Type</label>
        <select
          type="text"
          class="form-select"
          [(ngModel)]="dataManagementSettingsService.authenticationType"
          aria-label="authenticationType"
          name="authenticationType"
          id="authenticationType"
        >
          <option
            value="<None>"
            [selected]="
              dataManagementSettingsService.authenticationType === '<None>'
            "
          >
            None
          </option>
          <option
            value="LOGIN"
            [selected]="
              dataManagementSettingsService.authenticationType === 'LOGIN'
            "
          >
            LOGIN
          </option>
          <option
            value="NTLM"
            [selected]="
              dataManagementSettingsService.authenticationType === 'NTLM'
            "
          >
            NTLM
          </option>
          <option
            value="GSSAPI"
            [selected]="
              dataManagementSettingsService.authenticationType === 'GSSAPI'
            "
          >
            GSSAPI
          </option>
          <option
            value="WDIGEST"
            [selected]="
              dataManagementSettingsService.authenticationType === 'WDIGEST'
            "
          >
            WDIGEST
          </option>
        </select>
      </div>

      <div class="form-group secondColumn">
        <label for="setting-owner-address-zip">Disposition Notification</label>
        <select
          type="text"
          class="form-select"
          [(ngModel)]="dataManagementSettingsService.dispositionNotification"
          aria-label="dispositionNotification"
          name="dispositionNotification"
        >
          <option
            value="true"
            [selected]="
              dataManagementSettingsService.dispositionNotification === 'true'
            "
          >
            Yes
          </option>
          <option
            value="false"
            [selected]="
              dataManagementSettingsService.dispositionNotification === 'false'
            "
          >
            No
          </option>
        </select>
      </div>
    </div>

    <div class="row-line-singel">
      <div class="form-group firstColumn">
        <label for="readReceipt">Read Receipt</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="dataManagementSettingsService.readReceipt"
          aria-label="readReceipt"
          name="readReceipt"
          id="readReceipt"
        />
      </div>
    </div>

    <div class="row-line">
      <div class="form-group firstColumn">
        <label for="replyTo">Reply To / Sender Address</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="dataManagementSettingsService.replyTo"
          aria-label="replyTo"
          name="replyTo"
          id="replyTo"
        />
      </div>
    </div>

    <div class="row-line-single">
      <div class="form-group firstColumn">
        <label for="mark">Mark</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="dataManagementSettingsService.mark"
          aria-label="mark"
          name="mark"
          id="mark"
        />
      </div>
    </div>

    <div class="row-line">
      <div class="form-group firstColumn">
        <label for="outgoingServerAuthUser">SMTP Authentication User</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="dataManagementSettingsService.outgoingserverUsername"
          aria-label="outgoingServerAuthUser"
          name="outgoingServerAuthUser"
          id="outgoingServerAuthUser"
          autocomplete="new-password"
          role="textbox"
        />
      </div>

      <div class="form-group secondColumn">
        <label for="outgoingServerAuthKey">SMTP Authentication Key</label>
        <div class="password-field-container">
          <input
            [type]="showPassword ? 'text' : 'password'"
            class="form-control"
            [(ngModel)]="dataManagementSettingsService.outgoingserverPassword"
            name="outgoingServerAuthKey"
            id="outgoingServerAuthKey"
            aria-label="outgoingServerAuthKey"
            autocomplete="new-password"
          />
          <fa-icon
            [icon]="showPassword ? faEyeSlash : faEye"
            class="password-toggle-icon"
            (click)="showPassword = !showPassword"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          ></fa-icon>
        </div>
      </div>
    </div>

    <div class="test-email-section">
      <div class="test-button-container">
        <button
          type="button"
          class="btn btn-primary test-email-button"
          (click)="testEmailConfiguration()"
          [disabled]="isTestingEmail"
        >
          <span *ngIf="!isTestingEmail">{{ 'settings.email-setting.button.send-test-email' | translate }}</span>
          <span *ngIf="isTestingEmail">
            <span
              class="spinner-border spinner-border-sm me-2"
              role="status"
              aria-hidden="true"
            ></span>
            {{ 'settings.email-setting.button.sending' | translate }}
          </span>
        </button>
      </div>
    </div>
  </form>
</div>
