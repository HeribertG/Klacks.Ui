<!-- eslint-disable @angular-eslint/template/interactive-supports-focus -->
<div id="email-setting-container" class="container-dashboard">
  <div id="email-setting-header" class="container-header">{{ "settings.email-setting.headline" | translate }}</div>

  <div id="email-setting-line" class="container-line"></div>

  <div id="email-setting-form">
    <div id="email-setting-server-row" class="row-line">
      <div class="form-group firstColumn">
        <label for="outgoingServer">{{ "settings.email-setting.outgoing-server" | translate }}</label>
        <input
          type="text"
          class="form-control"
          [formField]="emailForm.outgoingServer"
          aria-label="outgoingServer"
          id="outgoingServer"
        />
      </div>
      <div class="form-group secondColumn">
        <label for="outgoingServerPort">{{ "settings.email-setting.outgoing-server-port" | translate }}</label>
        <input
          type="text"
          class="form-control"
          [formField]="emailForm.outgoingServerPort"
          aria-label="outgoingServerPort"
          id="outgoingServerPort"
        />
      </div>
    </div>
    <div id="email-setting-timeout-ssl-row" class="row-line">
      <div class="form-group firstColumn">
        <label for="outgoingServerTimeout">{{ "settings.email-setting.outgoing-server-timeout" | translate }}</label>
        <input
          type="text"
          class="form-control"
          [formField]="emailForm.outgoingServerTimeout"
          aria-label="outgoingServerTimeout"
          id="outgoingServerTimeout"
        />
      </div>
      <div class="form-group secondColumn">
        <label for="enabledSSL">{{ "settings.email-setting.enabled-ssl" | translate }}</label>
        <select
          class="form-select"
          [formField]="emailForm.enabledSSL"
          aria-label="enabledSSL"
          id="enabledSSL"
        >
          <option value="true">{{ "general.yes" | translate }}</option>
          <option value="false">{{ "general.no" | translate }}</option>
        </select>
      </div>
    </div>
    <div id="email-setting-auth-row" class="row-line">
      <div class="form-group firstColumn">
        <label for="authenticationType">{{ "settings.email-setting.authentication-type" | translate }}</label>
        <select
          class="form-select"
          [formField]="emailForm.authenticationType"
          aria-label="authenticationType"
          id="authenticationType"
        >
          <option value="<None>">{{ "settings.email-setting.auth-none" | translate }}</option>
          <option value="LOGIN">LOGIN</option>
          <option value="NTLM">NTLM</option>
          <option value="GSSAPI">GSSAPI</option>
          <option value="WDIGEST">WDIGEST</option>
        </select>
      </div>
      <div class="form-group secondColumn">
        <label for="dispositionNotification">{{ "settings.email-setting.disposition-notification" | translate }}</label>
        <select
          id="dispositionNotification"
          class="form-select"
          [formField]="emailForm.dispositionNotification"
          aria-label="dispositionNotification"
        >
          <option value="true">{{ "general.yes" | translate }}</option>
          <option value="false">{{ "general.no" | translate }}</option>
        </select>
      </div>
    </div>
    <div id="email-setting-read-receipt-row" class="row-line-singel">
      <div class="form-group firstColumn">
        <label for="readReceipt">{{ "settings.email-setting.read-receipt" | translate }}</label>
        <input
          type="text"
          class="form-control"
          [formField]="emailForm.readReceipt"
          aria-label="readReceipt"
          id="readReceipt"
        />
      </div>
    </div>
    <div id="email-setting-reply-to-row" class="row-line">
      <div class="form-group firstColumn">
        <label for="replyTo">{{ "settings.email-setting.reply-to" | translate }}</label>
        <input
          type="text"
          class="form-control"
          [formField]="emailForm.replyTo"
          aria-label="replyTo"
          id="replyTo"
        />
      </div>
    </div>
    <div id="email-setting-mark-row" class="row-line-single">
      <div class="form-group firstColumn">
        <label for="mark">{{ "settings.email-setting.mark" | translate }}</label>
        <input
          type="text"
          class="form-control"
          [formField]="contactForm.mark"
          aria-label="mark"
          id="mark"
        />
      </div>
    </div>
    <div id="email-setting-smtp-auth-row" class="row-line">
      <div class="form-group firstColumn">
        <label for="outgoingServerAuthUser">{{ "settings.email-setting.smtp-auth-user" | translate }}</label>
        <input
          type="text"
          class="form-control"
          [formField]="emailForm.username"
          aria-label="outgoingServerAuthUser"
          id="outgoingServerAuthUser"
          autocomplete="new-password"
          role="textbox"
        />
      </div>
      <div class="form-group secondColumn">
        <div class="input-group my-password">
          <label class="password-label" for="outgoingServerAuthKey"
            >{{ "settings.email-setting.smtp-auth-key" | translate }}</label
          >
          @if (showPassword()) {
            <input
              type="text"
              class="form-control password-input"
              [formField]="emailForm.password"
              id="outgoingServerAuthKey"
              aria-label="outgoingServerAuthKey"
              autocomplete="new-password"
            />
          } @else {
            <input
              type="password"
              class="form-control password-input"
              [formField]="emailForm.password"
              id="outgoingServerAuthKey"
              aria-label="outgoingServerAuthKey"
              autocomplete="new-password"
            />
          }
          <span
            id="setting-email-password-toggle"
            class="input-group-text"
            (click)="toggleShowPassword()"
          >
            <fa-icon
              [icon]="showPassword() ? faEye : faEyeSlash"
              class="password-icon"
            ></fa-icon>
          </span>
        </div>
      </div>
    </div>
    <div id="email-setting-test-section" class="test-email-section">
      <div
        id="email-setting-test-button-container"
        class="test-button-container"
      >
        <button
          id="setting-email-test-btn"
          type="button"
          class="btn btn-primary test-email-button"
          (click)="testEmailConfiguration()"
          [disabled]="isTestingEmail"
        >
          @if (!isTestingEmail) {
            <span>{{
              "settings.email-setting.button.send-test-email" | translate
            }}</span>
          } @else {
            <span>
              <span
                class="spinner-border spinner-border-sm me-2"
                role="status"
                aria-hidden="true"
              ></span>
              {{ "settings.email-setting.button.sending" | translate }}
            </span>
          }
        </button>
      </div>
    </div>
    <div class="bottom-border-space"></div>
  </div>
</div>
