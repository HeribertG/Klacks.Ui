<form id="group-scope-form">
  <div id="group-scope-header" class="container-header">
    {{ 'setting.group.headline' | translate }}
  </div>

  <div id="group-scope-line" class="container-line"></div>
  <div id="group-scope-box" class="container-box">
    <app-group-scope-header id="group-scope-table-header"></app-group-scope-header>
    @for (c of dataManagementSettingsService.userAdmin.accountsList(); track c.id ||
    c.userName || $index; let i = $index) {
    <div [id]="'group-scope-row-wrapper-' + i">
      <app-group-scope-row [id]="'group-scope-row-' + i" [user]="c"></app-group-scope-row>
    </div>
    }
  </div>
</form>
