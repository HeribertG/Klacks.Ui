<div id="scheduling-defaults-setting-container" class="container-dashboard">
  <div id="scheduling-defaults-setting-header" class="container-header">{{ 'settings.schedulingDefaults.headline' | translate }}</div>

  <div id="scheduling-defaults-setting-line" class="container-line"></div>

  @if (isDataLoaded) {
  <form id="scheduling-defaults-setting-form">
    <div id="scheduling-defaults-hours-row" class="row-line">
      <div class="form-group firstColumn">
        <label for="sdDefaultWorkingHours">{{ 'settings.work.default-working-hours' | translate }}</label>
        <input
          type="number"
          step="0.5"
          class="form-control"
          [formField]="schedulingForm.defaultWorkingHours"
          aria-label="sdDefaultWorkingHours"
          id="sdDefaultWorkingHours"
        />
      </div>
      <div class="form-group secondColumn">
        <label for="sdOvertimeThreshold">{{ 'settings.work.overtime-threshold' | translate }}</label>
        <input
          type="number"
          step="1"
          class="form-control"
          [formField]="schedulingForm.overtimeThreshold"
          aria-label="sdOvertimeThreshold"
          id="sdOvertimeThreshold"
        />
      </div>
    </div>
    <div id="scheduling-defaults-guaranteed-maximum-row" class="row-line">
      <div class="form-group firstColumn">
        <label for="sdGuaranteedHours">{{ 'settings.work.guaranteed-hours' | translate }}</label>
        <input
          type="number"
          step="1"
          class="form-control"
          [formField]="schedulingForm.guaranteedHours"
          aria-label="sdGuaranteedHours"
          id="sdGuaranteedHours"
        />
      </div>
      <div class="form-group secondColumn">
        <label for="sdMaximumHours">{{ 'settings.work.maximum-hours' | translate }}</label>
        <input
          type="number"
          step="1"
          class="form-control"
          [formField]="schedulingForm.maximumHours"
          aria-label="sdMaximumHours"
          id="sdMaximumHours"
        />
      </div>
    </div>
    <div id="scheduling-defaults-minimum-fulltime-row" class="row-line">
      <div class="form-group firstColumn">
        <label for="sdMinimumHours">{{ 'settings.work.minimum-hours' | translate }}</label>
        <input
          type="number"
          step="1"
          class="form-control"
          [formField]="schedulingForm.minimumHours"
          aria-label="sdMinimumHours"
          id="sdMinimumHours"
        />
      </div>
      <div class="form-group secondColumn">
        <label for="sdFullTime">{{ 'settings.work.full-time' | translate }}</label>
        <input
          type="number"
          step="1"
          class="form-control"
          [formField]="schedulingForm.fullTime"
          aria-label="sdFullTime"
          id="sdFullTime"
        />
      </div>
    </div>
    <div id="scheduling-defaults-workdays-row" class="row-line" style="margin-top: 16px;">
      <div class="form-group firstColumn">
        <label for="sdSchedulingMaxWorkDays">{{ 'settings.work.scheduling-max-work-days' | translate }}</label>
        <input
          type="number"
          step="1"
          class="form-control"
          [formField]="schedulingForm.schedulingMaxWorkDays"
          aria-label="sdSchedulingMaxWorkDays"
          id="sdSchedulingMaxWorkDays"
        />
      </div>
      <div class="form-group secondColumn">
        <label for="sdSchedulingMinRestDays">{{ 'settings.work.scheduling-min-rest-days' | translate }}</label>
        <input
          type="number"
          step="1"
          class="form-control"
          [formField]="schedulingForm.schedulingMinRestDays"
          aria-label="sdSchedulingMinRestDays"
          id="sdSchedulingMinRestDays"
        />
      </div>
    </div>
    <div id="scheduling-defaults-pause-row" class="row-line">
      <div class="form-group firstColumn">
        <label for="sdSchedulingMinPauseHours">{{ 'settings.work.scheduling-min-pause-hours' | translate }}</label>
        <input
          type="number"
          step="0.5"
          class="form-control"
          [formField]="schedulingForm.schedulingMinPauseHours"
          aria-label="sdSchedulingMinPauseHours"
          id="sdSchedulingMinPauseHours"
        />
      </div>
      <div class="form-group secondColumn">
        <label for="sdSchedulingMaxOptimalGap">{{ 'settings.work.scheduling-max-optimal-gap' | translate }}</label>
        <input
          type="number"
          step="0.5"
          class="form-control"
          [formField]="schedulingForm.schedulingMaxOptimalGap"
          aria-label="sdSchedulingMaxOptimalGap"
          id="sdSchedulingMaxOptimalGap"
        />
      </div>
    </div>
    <div id="scheduling-defaults-daily-weekly-row" class="row-line">
      <div class="form-group firstColumn">
        <label for="sdSchedulingMaxDailyHours">{{ 'settings.work.scheduling-max-daily-hours' | translate }}</label>
        <input
          type="number"
          step="0.5"
          class="form-control"
          [formField]="schedulingForm.schedulingMaxDailyHours"
          aria-label="sdSchedulingMaxDailyHours"
          id="sdSchedulingMaxDailyHours"
        />
      </div>
      <div class="form-group secondColumn">
        <label for="sdSchedulingMaxWeeklyHours">{{ 'settings.work.scheduling-max-weekly-hours' | translate }}</label>
        <input
          type="number"
          step="1"
          class="form-control"
          [formField]="schedulingForm.schedulingMaxWeeklyHours"
          aria-label="sdSchedulingMaxWeeklyHours"
          id="sdSchedulingMaxWeeklyHours"
        />
      </div>
    </div>
    <div id="scheduling-defaults-consecutive-row" class="row-line">
      <div class="form-group firstColumn">
        <label for="sdSchedulingMaxConsecutiveDays">{{ 'settings.work.scheduling-max-consecutive-days' | translate }}</label>
        <input
          type="number"
          step="1"
          class="form-control"
          [formField]="schedulingForm.schedulingMaxConsecutiveDays"
          aria-label="sdSchedulingMaxConsecutiveDays"
          id="sdSchedulingMaxConsecutiveDays"
        />
      </div>
      <div class="form-group secondColumn">
      </div>
    </div>
    <div id="scheduling-defaults-rates-row-1" class="row-line" style="margin-top: 16px;">
      <div class="form-group firstColumn">
        <label for="sdNightRate">{{ 'settings.work.night-rate' | translate }} (%)</label>
        <input
          type="number"
          step="1"
          class="form-control"
          [formField]="schedulingForm.nightRate"
          aria-label="sdNightRate"
          id="sdNightRate"
        />
      </div>
      <div class="form-group secondColumn">
        <label for="sdHolidayRate">{{ 'settings.work.holiday-rate' | translate }} (%)</label>
        <input
          type="number"
          step="1"
          class="form-control"
          [formField]="schedulingForm.holidayRate"
          aria-label="sdHolidayRate"
          id="sdHolidayRate"
        />
      </div>
    </div>
    <div id="scheduling-defaults-rates-row-2" class="row-line">
      <div class="form-group firstColumn">
        <label for="sdSaRate">{{ 'settings.work.sa-rate' | translate }} (%)</label>
        <input
          type="number"
          step="1"
          class="form-control"
          [formField]="schedulingForm.saRate"
          aria-label="sdSaRate"
          id="sdSaRate"
        />
      </div>
      <div class="form-group secondColumn">
        <label for="sdSoRate">{{ 'settings.work.so-rate' | translate }} (%)</label>
        <input
          type="number"
          step="1"
          class="form-control"
          [formField]="schedulingForm.soRate"
          aria-label="sdSoRate"
          id="sdSoRate"
        />
      </div>
    </div>
    <div class="bottom-border-space"></div>
  </form>
  }
</div>
