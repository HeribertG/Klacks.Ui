<app-settings-list-card
  [headline]="'setting.report.headline' | translate"
  [addLabel]="'setting.report.add' | translate"
  [showAddButton]="true"
  [showHeader]="true"
  idPrefix="reports"
  (addClick)="onClickAdd()"
>
  <app-report-header header></app-report-header>

  <div rows>
    @for (r of dataManagementReportService.reportTemplateList(); track r.id || $index; let i = $index) {
      @if (!r.isDeleted) {
        <app-report-row
          [id]="'report-row-' + i"
          [data]="r"
          (isDeleteEvent)="openDeleteReport(i)"
          (cancelNewEvent)="cancelNewReport(i)"
          (duplicateEvent)="duplicateReport(i)"
        >
        </app-report-row>
      }
    }
  </div>
</app-settings-list-card>
