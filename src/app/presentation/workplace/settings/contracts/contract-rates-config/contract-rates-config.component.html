<div
  id="contract-modal-rates-row"
  class="row-line-modal-inline rates-config-row"
>
  <div
    id="contract-modal-night-rate-item"
    class="rate-config-item align-left"
  >
    <label for="nightRate">{{
      "setting.contract.nightRate-modal" | translate
    }}</label>
    <div class="rate-input-group">
      <input
        type="number"
        [formField]="state.contractForm.nightRate"
        class="form-control rate-input"
        id="nightRate"
        aria-label="nightRate"
        [placeholder]="'setting.contract.rate-standard-placeholder' | translate"
      />
      <span class="rate-unit">%</span>
    </div>
  </div>

  <div
    id="contract-modal-holiday-rate-item"
    class="rate-config-item align-center"
  >
    <label for="holidayRate">{{
      "setting.contract.holidayRate-modal" | translate

      <input

        class="form-control rate-input"
        id="holidayRate"
        aria-label="holidayRate"
        [placeholder]="'setting.contract.rate-standard-placeholder' | translate"
      />
      <span class="rate-unit">%</span>
    </div>
  </div>

  <div
    id="contract-modal-we1-rate-item"
    class="rate-config-item align-center"
  >
    <label for="we1Rate">{{
      "setting.contract.we1Rate-modal" | translate

        [formField]="state.contractForm.we1Rate"
        class="form-control rate-input"

        aria-label="we1Rate"
        [placeholder]="'setting.contract.rate-standard-placeholder' | translate"
      />
      <span class="rate-unit">%</span>
    </div>
  </div>

  <div
    id="contract-modal-we2-rate-item"
    class="rate-config-item align-right"
  >
    <label for="we2Rate">{{
      "setting.contract.we2Rate-modal" | translate
    }}</label>
    <div class="rate-input-group">
      <input
        type="number"
        [formField]="state.contractForm.we2Rate"
        class="form-control rate-input"
        id="we2Rate"
        aria-label="we2Rate"
        [placeholder]="'setting.contract.rate-standard-placeholder' | translate"
      />
      <span class="rate-unit">%</span>
    </div>
  </div>
</div>
