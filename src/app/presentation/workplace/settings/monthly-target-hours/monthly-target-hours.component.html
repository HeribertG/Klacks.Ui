@if (isDataLoaded()) {
  <app-settings-list-card
    [headline]="'settings.monthlyTargetHours' | translate"
    [showAddButton]="false"
    [showHeader]="true"
    idPrefix="monthly-target-hours"
  >
    <div header id="monthly-target-hours-header" class="year-header">
      <app-counter
        id="monthly-target-hours-year-counter"
        [maxNumber]="maxYear"
        [currentNumber]="year()"
        (isChanged)="setYear($event)"
      >
      </app-counter>
      <span class="settings-hint">{{
        "setting.monthlyTargetHours.empty-means-no-override" | translate
      }}</span>
    </div>
    <div rows>
      @for (month of months; track month) {
        <div class="row-line-single" id="monthly-target-hours-row-{{ month }}">
          <div class="form-group month-column">
            <label [attr.for]="'monthlyTargetHours-' + month">{{ monthLabel(month) }}</label>
          </div>
          <div class="form-group hours-column">
            <input
              type="number"
              step="0.25"
              min="0"
              class="form-control"
              id="monthlyTargetHours-{{ month }}"
              name="monthlyTargetHours-{{ month }}"
              [attr.data-klacksy-target]="'monthly-target-hours.' + month"
              [attr.aria-label]="monthLabel(month)"
              [ngModel]="hoursOf(month)"
              (change)="onHoursChange(month, $any($event.target).value)"
            />
          </div>
        </div>
      }
    </div>
  </app-settings-list-card>
}
