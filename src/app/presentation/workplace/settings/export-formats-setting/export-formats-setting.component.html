@if (isDataLoaded()) {
<app-settings-list-card
  [headline]="'settings.exportFormats.title' | translate"
  [showAddButton]="false"
  [showHeader]="true"
  idPrefix="export-formats-setting"
>
  <div header id="export-formats-setting-info" class="info-text">
    {{ 'settings.exportFormats.description' | translate }}
  </div>
  <div rows>
    @for (format of formats(); track format.key) {
    <div class="row-line-single">
      <div class="form-group firstColumn">
        <label class="checkbox-label">
          <input
            type="checkbox"
            [checked]="format.enabled"
            [disabled]="format.fixed"
            (change)="toggle(format)"
            [attr.aria-label]="labelKey(format.key) | translate"
          />
          {{ labelKey(format.key) | translate }}
          @if (format.fixed) {
          <span class="text-muted">{{ 'settings.exportFormats.fixed' | translate }}</span>
          }
        </label>
      </div>
    </div>
    }
  </div>
</app-settings-list-card>
}
