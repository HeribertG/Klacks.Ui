@if (isDataLoaded()) {
<app-settings-list-card
  [headline]="'settings.exportFormats.title' | translate"
  [showAddButton]="false"
  [showHeader]="true"
  idPrefix="export-formats-setting"
>
  <div header id="export-formats-setting-info" class="info-text">
    {{ 'settings.exportFormats.description' | translate }}
  </div>
  <div rows>
    @for (family of families(); track family.brand) {
    @if (family.isGroup) {
    <div class="row-line-single">
      <div class="form-group firstColumn">
        <label class="checkbox-label">
          <input
            type="checkbox"
            [checked]="groupChecked(family)"
            (change)="toggleGroup(family)"
            [attr.aria-label]="labelKey(family.brand) | translate"
          />
          {{ labelKey(family.brand) | translate }}
        </label>
      </div>
    </div>
    @if (family.orders; as orders) {
    <div class="row-line-single">
      <div class="form-group slotColumn">
        <label class="checkbox-label">
          <input
            type="checkbox"
            [checked]="orders.enabled"
            (change)="toggle(orders)"
            [attr.aria-label]="'settings.exportFormats.slotOrders' | translate"
          />
          {{ 'settings.exportFormats.slotOrders' | translate }}
        </label>
      </div>
    </div>
    }
    @if (family.payroll; as payroll) {
    <div class="row-line-single">
      <div class="form-group slotColumn">
        <label class="checkbox-label">
          <input
            type="checkbox"
            [checked]="payroll.enabled"
            (change)="toggle(payroll)"
            [attr.aria-label]="'settings.exportFormats.slotPayroll' | translate"
          />
          {{ 'settings.exportFormats.slotPayroll' | translate }}
        </label>
      </div>
    </div>
    }
    } @else if (family.single; as format) {
    <div class="row-line-single">
      <div class="form-group firstColumn">
        <label class="checkbox-label">
          <input
            type="checkbox"
            [checked]="format.enabled"
            [disabled]="format.fixed"
            (change)="toggle(format)"
            [attr.aria-label]="labelKey(format.key) | translate"
          />
          {{ labelKey(format.key) | translate }}
          @if (format.fixed) {
          <span class="text-muted">{{ 'settings.exportFormats.fixed' | translate }}</span>
          }
        </label>
      </div>
    </div>
    }
    }
  </div>
</app-settings-list-card>
}
