<div id="settings-home-openroute-deepl-row" class="container-profilline">
  <app-openroute
    id="settings-openroute"
    class="container-setting-small first border-right-card border-bottom-card"
    data-klacksy-target="openroute"
    data-klacksy-label-key="settings.openroute"
    data-klacksy-category="settings.integrations"
    data-klacksy-route="/workplace/settings"
  >
  </app-openroute>

  <app-deepl
    id="settings-deepl"
    class="container-setting-small border-right-card border-bottom-card"
    data-klacksy-target="deepl"
    data-klacksy-label-key="settings.deepl"
    data-klacksy-category="settings.integrations"
    data-klacksy-route="/workplace/settings"
  >
  </app-deepl>
</div>

@if (authorizationService.isAdmin) {
  <div id="settings-home-geo-services-row" class="container-profilline">
    <app-geo-services-status
      id="settings-geo-services-status"
      class="container-setting-small first border-right-card border-bottom-card"
    >
    </app-geo-services-status>
  </div>
}

<div id="settings-home-web-search-row" class="container-profilline">
  <app-web-search
    id="settings-web-search"
    class="container-setting-small first border-right-card border-bottom-card"
    data-klacksy-target="web-search"
    data-klacksy-label-key="settings.web-search"
    data-klacksy-category="settings.integrations"
    data-klacksy-route="/workplace/settings"
  >
  </app-web-search>
</div>

@if (featurePluginState.isPluginEnabled(messagingPluginName)) {
  <div
    id="settings-home-messaging-providers-row"
    class="container-profilline"
  >
    <lib-messaging-providers
      id="settings-messaging-providers"
      class="container-profile first border-right-card border-bottom-card"
      data-klacksy-target="messaging-providers"
      data-klacksy-label-key="settings.messagingProviders"
      data-klacksy-category="settings.integrations"
      data-klacksy-route="/workplace/settings"
    >
    </lib-messaging-providers>
  </div>
  <div id="settings-home-owner-messengers-row" class="container-profilline">
    <lib-owner-messengers
      id="settings-owner-messengers"
      class="container-profile first border-right-card border-bottom-card"
      data-klacksy-target="owner-messengers"
      data-klacksy-label-key="settings.ownerMessengers"
      data-klacksy-category="settings.integrations"
      data-klacksy-route="/workplace/settings"
    >
    </lib-owner-messengers>
  </div>
}
