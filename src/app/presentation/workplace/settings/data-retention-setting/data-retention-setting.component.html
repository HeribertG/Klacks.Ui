<div id="data-retention-setting-container" class="container-dashboard">
  <div id="data-retention-setting-header" class="container-header">{{ 'settings.data-retention.title' | translate }}</div>

  <div id="data-retention-setting-line" class="container-line"></div>

  @if (isDataLoaded) {
  <form id="data-retention-setting-form">
    <div class="info-text">{{ 'settings.data-retention.description' | translate }}</div>
    <div id="data-retention-setting-days-row" class="row-line">
      <div class="form-group firstColumn">
        <label for="dataRetentionDays">{{ 'settings.data-retention.days' | translate }}</label>
        <input
          type="number"
          step="1"
          class="form-control"
          [formField]="retentionForm.dataRetentionDays"
          aria-label="dataRetentionDays"
          id="dataRetentionDays"
        />
      </div>
      <div class="form-group secondColumn hint-column">
        <span class="hint-text">{{ retentionDisplay() }}</span>
      </div>
    </div>
    <div class="bottom-border-space"></div>
  </form>
  }
</div>
