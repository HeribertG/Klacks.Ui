<app-settings-list-card
  [headline]="'settings.language-plugins.title' | translate"
  [showAddButton]="false"
  idPrefix="language-plugins"
  [showHeader]="true"
>
  <app-language-plugins-header header id="language-plugins-table-header"></app-language-plugins-header>
  <div rows>
    @for (plugin of plugins; track plugin.code; let i = $index) {
      <app-language-plugins-row
        [id]="'language-plugins-row-' + i"
        [data]="plugin"
        (uninstallEvent)="onUninstall($event)"
      />
    }
  </div>
</app-settings-list-card>

<button
  id="language-plugins-search-btn"
  class="btn btn-primary search-btn"
  type="button"
  (click)="openMarketplaceModal()"
  [title]="'settings.language-plugins.action.search' | translate"
>
  <app-icon-search />
</button>

<ng-template #marketplaceModal let-modal>
  <div class="modal-header">
    <div class="container-header-modal modal-title">
      {{ 'settings.language-plugins.modal.title' | translate }}
    </div>
    <span class="filler"></span>
    <div class="close" aria-label="Close" tabindex="0" (click)="modal.dismiss()" (keydown.enter)="modal.dismiss()">
      <span aria-hidden="true" style="font-size: 13px; border: 1px transparent solid; color: var(--colorWorkplaceHeadline);">&times;</span>
    </div>
  </div>
  <div class="modal-body">
    <app-marketplace-browse
      [installedCodes]="installedCodes"
      (installed)="onMarketplaceInstalled($event)">
    </app-marketplace-browse>
  </div>
  <div class="modal-footer">
    <span class="link-button red-font" tabindex="0" (click)="modal.dismiss()" (keydown.enter)="modal.dismiss()">
      {{ 'close' | translate }}
    </span>
  </div>
</ng-template>
