<div [id]="'language-plugins-row-container-' + data.code" class="first custom-control-inline">
  <span class="col-language">{{ data.code.toUpperCase() }}</span>
  <span class="col-display-name">{{ data.displayName }}</span>
  <span class="col-author">{{ data.author }}</span>
  <span class="col-version">{{ data.version }}</span>
  <span class="col-coverage">{{ data.coverage | number:'1.0-0' }}%</span>
  <span class="col-status">
    <span class="status-badge" [class]="getStatusClass()">
      {{ translate.instant(getStatusKey()) }}
    </span>
  </span>
  <span class="col-actions">
    @if (!data.isCore && !data.isInstalled) {
      <button class="action-btn install-btn" (click)="onInstall()">
        {{ translate.instant("settings.language-plugins.action.install") }}
      </button>
    }
    @if (!data.isCore && data.isInstalled) {
      <button class="action-btn uninstall-btn" (click)="onUninstall()">
        {{ translate.instant("settings.language-plugins.action.uninstall") }}
      </button>
    }
  </span>
</div>
