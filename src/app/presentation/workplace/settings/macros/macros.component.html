<app-settings-list-card
  [headline]="'setting.macro.headline' | translate"
  [addLabel]="'setting.macro.add' | translate"
  [showAddButton]="true"
  [showHeader]="true"
  idPrefix="macros"
  [idPrefix]="'macros'"
  (addClick)="onClickAdd()"
>
  <app-macro-header header></app-macro-header>

  <div rows>
    @for (c of dataManagementSettingsService.macros.macroList(); track c.id || $index; let i = $index) {
      @if (!(c.isDirty === 3)) {
        <app-macro-row
          [id]="'macro-row-' + i"
          [data]="c"
          (isDeleteEvent)="openDeleteMacro(i)"
          (cancelNewEvent)="cancelNewMacro(i)"
          (macroChangedEvent)="onMacroChanged(i)"
        >
        </app-macro-row>
      }
    }
  </div>
</app-settings-list-card>
