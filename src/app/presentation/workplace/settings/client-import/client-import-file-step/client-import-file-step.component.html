<div class="container-header">
  {{ "clientImport.file.header" | translate }}
</div>
<div class="container-line"></div>

<div class="form-group first import-file-body">
  <p class="settings-hint">{{ "clientImport.file.intro" | translate }}</p>

  <button
    id="client-import-drop-zone"
    data-klacksy-target="client-import-drop-zone"
    data-klacksy-label-key="clientImport.file.header"
    data-klacksy-category="data.people"
    type="button"
    class="fileupload-zone"
    [class.disabled]="state.isParsing()"
    [disabled]="state.isParsing()"
    appDragDropFileUpload
    (click)="onChooseFile()"
    (fileDropped)="onFilesDropped($event)"
  >
    <span class="settings-hint">
      @if (state.isParsing()) {
        {{ "clientImport.file.reading" | translate }}
      } @else {
        {{ "clientImport.file.dropZone" | translate }}
      }
    </span>
  </button>
  <input
    #fileInput
    id="client-import-file-input"
    type="file"
    class="hidden-file-input"
    [accept]="accept"
    aria-hidden="true"
    tabindex="-1"
    (change)="onFileSelected($event)"
  />

  @if (fileErrorKey(); as errorKey) {
    <div id="client-import-file-error" class="settings-hint status-text-error" role="alert">
      {{ errorKey | translate }}
    </div>
  }

  <div class="import-template">
    <span class="settings-hint">{{ "clientImport.file.templateHint" | translate }}</span>
    <button
      id="client-import-template-button"
      data-klacksy-target="client-import-template-button"
      data-klacksy-label-key="clientImport.file.downloadTemplate"
      data-klacksy-category="data.people"
      type="button"
      class="btn normal-btn"
      (click)="onDownloadTemplate()"
    >
      {{ "clientImport.file.downloadTemplate" | translate }}
    </button>
  </div>

  <p class="settings-hint">{{ "clientImport.file.privacy" | translate }}</p>
</div>
