<!-- eslint-disable @angular-eslint/template/label-has-associated-control -->
<div id="surcharge-mode-settings-container" class="container-dashboard">
  <div id="surcharge-mode-settings-header" class="container-header">
    {{ "setting.surchargeMode.headline" | translate }}
  </div>

  <div id="surcharge-mode-settings-line" class="container-line"></div>

  <div class="standard-tabs-header">
    <ul class="nav nav-tabs">
      <li class="nav-item">
        <a
          id="surcharge-mode-settings-tab-settings"
          class="nav-link"
          [class.active]="activeTab() === 'settings'"
          role="tab"
          [attr.aria-selected]="activeTab() === 'settings'"
          tabindex="0"
          (click)="setTab('settings')"
          (keydown.enter)="setTab('settings')"
        >
          {{ "setting.tab.settings" | translate }}
        </a>
      </li>
      <li class="nav-item">
        <a
          id="surcharge-mode-settings-tab-manual"
          class="nav-link"
          [class.active]="activeTab() === 'manual'"
          role="tab"
          [attr.aria-selected]="activeTab() === 'manual'"
          tabindex="0"
          (click)="setTab('manual')"
          (keydown.enter)="setTab('manual')"
        >
          {{ "setting.tab.manual" | translate }}
        </a>
      </li>
    </ul>
  </div>

  <div class="standard-tab-body">
  @if (isDataLoaded) {
    <form
      id="surcharge-mode-settings-form"
      [style.display]="activeTab() === 'settings' ? 'block' : 'none'"
    >
      <div id="surcharge-mode-intro-row" class="row-line-single">
        <p class="hint-text">
          {{ "setting.surchargeMode.hint" | translate }}
        </p>
      </div>

      <div id="surcharge-mode-modes-header-row" class="row-line" style="margin-top: 16px">
        <div class="form-group firstColumn">
          <label>{{ "setting.surchargeMode.modes-header" | translate }}</label>
        </div>
      </div>
      <div id="surcharge-mode-night-holiday-mode-row" class="row-line">
        <div class="form-group firstColumn">
          <label for="smNightRateMode">{{
            "setting.surchargeMode.night-rate-mode" | translate
          }}</label>
          <select
            class="form-control"
            [formField]="surchargeForm.nightRateMode"
            aria-label="smNightRateMode"
            id="smNightRateMode"
          >
            <option value="multiplier">{{ "setting.surchargeMode.rateMode.multiplier" | translate }}</option>
            <option value="fixedperhour">{{ "setting.surchargeMode.rateMode.fixedperhour" | translate }}</option>
            <option value="fixedpershift">{{ "setting.surchargeMode.rateMode.fixedpershift" | translate }}</option>
          </select>
        </div>
        <div class="form-group secondColumn">
          <label for="smHolidayRateMode">{{
            "setting.surchargeMode.holiday-rate-mode" | translate
          }}</label>
          <select
            class="form-control"
            [formField]="surchargeForm.holidayRateMode"
            aria-label="smHolidayRateMode"
            id="smHolidayRateMode"
          >
            <option value="multiplier">{{ "setting.surchargeMode.rateMode.multiplier" | translate }}</option>
            <option value="fixedperhour">{{ "setting.surchargeMode.rateMode.fixedperhour" | translate }}</option>
            <option value="fixedpershift">{{ "setting.surchargeMode.rateMode.fixedpershift" | translate }}</option>
          </select>
        </div>
      </div>
      <div id="surcharge-mode-we1-we2-mode-row" class="row-line">
        <div class="form-group firstColumn">
          <label for="smWe1RateMode">{{
            "setting.surchargeMode.we1-rate-mode" | translate
          }}</label>
          <select
            class="form-control"
            [formField]="surchargeForm.we1RateMode"
            aria-label="smWe1RateMode"
            id="smWe1RateMode"
          >
            <option value="multiplier">{{ "setting.surchargeMode.rateMode.multiplier" | translate }}</option>
            <option value="fixedperhour">{{ "setting.surchargeMode.rateMode.fixedperhour" | translate }}</option>
            <option value="fixedpershift">{{ "setting.surchargeMode.rateMode.fixedpershift" | translate }}</option>
          </select>
        </div>
        <div class="form-group secondColumn">
          <label for="smWe2RateMode">{{
            "setting.surchargeMode.we2-rate-mode" | translate
          }}</label>
          <select
            class="form-control"
            [formField]="surchargeForm.we2RateMode"
            aria-label="smWe2RateMode"
            id="smWe2RateMode"
          >
            <option value="multiplier">{{ "setting.surchargeMode.rateMode.multiplier" | translate }}</option>
            <option value="fixedperhour">{{ "setting.surchargeMode.rateMode.fixedperhour" | translate }}</option>
            <option value="fixedpershift">{{ "setting.surchargeMode.rateMode.fixedpershift" | translate }}</option>
          </select>
        </div>
      </div>
      <div id="surcharge-mode-we3-mode-rate-row" class="row-line">
        <div class="form-group firstColumn">
          <label for="smWe3RateMode">{{
            "setting.surchargeMode.we3-rate-mode" | translate
          }}</label>
          <select
            class="form-control"
            [formField]="surchargeForm.we3RateMode"
            aria-label="smWe3RateMode"
            id="smWe3RateMode"
          >
            <option value="multiplier">{{ "setting.surchargeMode.rateMode.multiplier" | translate }}</option>
            <option value="fixedperhour">{{ "setting.surchargeMode.rateMode.fixedperhour" | translate }}</option>
            <option value="fixedpershift">{{ "setting.surchargeMode.rateMode.fixedpershift" | translate }}</option>
          </select>
        </div>
        <div class="form-group secondColumn">
          <label for="smWe3Rate"
            >{{ "setting.surchargeMode.we3-rate" | translate }} (%)</label
          >
          <input
            type="number"
            step="1"
            class="form-control"
            [formField]="surchargeForm.we3Rate"
            aria-label="smWe3Rate"
            id="smWe3Rate"
          />
        </div>
      </div>

      <div id="surcharge-mode-minimums-header-row" class="row-line" style="margin-top: 16px">
        <div class="form-group firstColumn">
          <label>{{ "setting.surchargeMode.minimums-header" | translate }}</label>
        </div>
      </div>
      <div id="surcharge-mode-night-holiday-min-row" class="row-line">
        <div class="form-group firstColumn">
          <label for="smNightMinimumPerHour">{{
            "setting.surchargeMode.night-minimum-per-hour" | translate
          }}</label>
          <input
            type="number"
            step="0.01"
            class="form-control"
            [formField]="surchargeForm.nightMinimumPerHour"
            aria-label="smNightMinimumPerHour"
            id="smNightMinimumPerHour"
          />
        </div>
        <div class="form-group secondColumn">
          <label for="smHolidayMinimumPerHour">{{
            "setting.surchargeMode.holiday-minimum-per-hour" | translate
          }}</label>
          <input
            type="number"
            step="0.01"
            class="form-control"
            [formField]="surchargeForm.holidayMinimumPerHour"
            aria-label="smHolidayMinimumPerHour"
            id="smHolidayMinimumPerHour"
          />
        </div>
      </div>
      <div id="surcharge-mode-we1-we2-min-row" class="row-line">
        <div class="form-group firstColumn">
          <label for="smWe1MinimumPerHour">{{
            "setting.surchargeMode.we1-minimum-per-hour" | translate
          }}</label>
          <input
            type="number"
            step="0.01"
            class="form-control"
            [formField]="surchargeForm.we1MinimumPerHour"
            aria-label="smWe1MinimumPerHour"
            id="smWe1MinimumPerHour"
          />
        </div>
        <div class="form-group secondColumn">
          <label for="smWe2MinimumPerHour">{{
            "setting.surchargeMode.we2-minimum-per-hour" | translate
          }}</label>
          <input
            type="number"
            step="0.01"
            class="form-control"
            [formField]="surchargeForm.we2MinimumPerHour"
            aria-label="smWe2MinimumPerHour"
            id="smWe2MinimumPerHour"
          />
        </div>
      </div>
      <div id="surcharge-mode-we3-min-row" class="row-line">
        <div class="form-group firstColumn">
          <label for="smWe3MinimumPerHour">{{
            "setting.surchargeMode.we3-minimum-per-hour" | translate
          }}</label>
          <input
            type="number"
            step="0.01"
            class="form-control"
            [formField]="surchargeForm.we3MinimumPerHour"
            aria-label="smWe3MinimumPerHour"
            id="smWe3MinimumPerHour"
          />
        </div>
        <div class="form-group secondColumn"></div>
      </div>

      <div id="surcharge-mode-night-window-header-row" class="row-line" style="margin-top: 16px">
        <div class="form-group firstColumn">
          <label>{{ "setting.surchargeMode.night-window-header" | translate }}</label>
        </div>
      </div>
      <div id="surcharge-mode-night-window-row" class="row-line">
        <div class="form-group firstColumn">
          <label for="smNightStart">{{
            "setting.surchargeMode.night-start" | translate
          }}</label>
          <input
            type="time"
            class="form-control"
            [formField]="surchargeForm.nightStart"
            aria-label="smNightStart"
            id="smNightStart"
          />
        </div>
        <div class="form-group secondColumn">
          <label for="smNightEnd">{{
            "setting.surchargeMode.night-end" | translate
          }}</label>
          <input
            type="time"
            class="form-control"
            [formField]="surchargeForm.nightEnd"
            aria-label="smNightEnd"
            id="smNightEnd"
          />
        </div>
      </div>

      <div id="surcharge-mode-stacking-header-row" class="row-line" style="margin-top: 16px">
        <div class="form-group firstColumn">
          <label>{{ "setting.surchargeMode.stacking-header" | translate }}</label>
        </div>
      </div>
      <div id="surcharge-mode-stacking-row" class="row-line">
        <div class="form-group firstColumn">
          <label for="smStackingMode">{{
            "setting.surchargeMode.stacking-mode" | translate
          }}</label>
          <select
            class="form-control"
            [formField]="surchargeForm.stackingMode"
            aria-label="smStackingMode"
            id="smStackingMode"
          >
            <option value="highestwins">{{ "setting.surchargeMode.stacking.highestwins" | translate }}</option>
            <option value="additive">{{ "setting.surchargeMode.stacking.additive" | translate }}</option>
          </select>
        </div>
        <div class="form-group secondColumn"></div>
      </div>
      <div id="surcharge-mode-stacking-hint-row" class="row-line-single">
        <p class="hint-text">
          {{ "setting.surchargeMode.stacking.hint" | translate }}
        </p>
      </div>

      <div class="bottom-border-space"></div>
    </form>
  }

    <div
      id="surcharge-mode-settings-manual-content"
      class="manual-content"
      [innerHTML]="manualContent()"
      [style.display]="activeTab() === 'manual' ? 'block' : 'none'"
    ></div>
  </div>
</div>
