<app-settings-list-card
  [headline]="translate.instant('settings.identity-provider.headline')"
  [addLabel]="translate.instant('settings.identity-provider.add')"
  [showAddButton]="true"
  (addClick)="onClickAdd()"
>
  <ng-container rows>
    @for (provider of providerService.providerList(); track provider.id; let i = $index) {
      <app-identity-provider-row
        [id]="'identity-provider-row-' + i"
        [data]="provider"
        (isDeleteEvent)="openDeleteProvider(i)"
        (cancelNewEvent)="cancelNewProvider(i)"
        (providerChangedEvent)="onProviderChanged(i)"
      >
      </app-identity-provider-row>
    }
  </ng-container>
</app-settings-list-card>
