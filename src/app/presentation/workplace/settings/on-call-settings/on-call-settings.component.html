<!-- eslint-disable @angular-eslint/template/label-has-associated-control -->
<div id="on-call-settings-container" class="container-dashboard">
  <div id="on-call-settings-header" class="container-header">
    {{ "setting.onCall.title" | translate }}
  </div>

  <div id="on-call-settings-line" class="container-line"></div>

  <div class="standard-tabs-header">
    <ul class="nav nav-tabs">
      <li class="nav-item">
        <a
          id="on-call-settings-tab-settings"
          class="nav-link"
          [class.active]="activeTab() === 'settings'"
          role="tab"
          [attr.aria-selected]="activeTab() === 'settings'"
          tabindex="0"
          (click)="activeTab.set('settings')"
          (keydown.enter)="activeTab.set('settings')"
        >
          {{ "setting.tab.settings" | translate }}
        </a>
      </li>
      <li class="nav-item">
        <a
          id="on-call-settings-tab-manual"
          class="nav-link"
          [class.active]="activeTab() === 'manual'"
          role="tab"
          [attr.aria-selected]="activeTab() === 'manual'"
          tabindex="0"
          (click)="activeTab.set('manual')"
          (keydown.enter)="activeTab.set('manual')"
        >
          {{ "setting.tab.manual" | translate }}
        </a>
      </li>
    </ul>
  </div>

  <div class="standard-tab-body">
  @if (activeTab() === 'settings') {
  @if (isDataLoaded) {
    <form id="on-call-settings-form">
      <div id="on-call-settings-description-row" class="row-line">
        <div class="form-group firstColumn">
          <label>{{ "setting.onCall.description" | translate }}</label>
        </div>
      </div>
      <div id="on-call-settings-enabled-row" class="row-line" style="margin-top: 16px">
        <div class="form-group firstColumn">
          <label for="ocEnabled">&#8203;</label>
          <label class="checkbox-label">
            <input
              type="checkbox"
              [formField]="onCallForm.onCallEnabled"
              id="ocEnabled"
            />
            {{ "setting.onCall.enabled" | translate }}
          </label>
        </div>
        <div class="form-group secondColumn"></div>
      </div>
      <div id="on-call-settings-percent-row" class="row-line" style="margin-top: 16px">
        <div class="form-group firstColumn">
          <label for="ocPresencePercent"
            >{{ "setting.onCall.presencePercent" | translate }} (%)</label
          >
          <input
            type="number"
            step="1"
            class="form-control"
            [formField]="onCallForm.onCallPresenceCountsPercent"
            aria-label="ocPresencePercent"
            id="ocPresencePercent"
          />
        </div>
        <div class="form-group secondColumn">
          <label for="ocStandbyPercent"
            >{{ "setting.onCall.standbyPercent" | translate }} (%)</label
          >
          <input
            type="number"
            step="1"
            class="form-control"
            [formField]="onCallForm.onCallStandbyCountsPercent"
            aria-label="ocStandbyPercent"
            id="ocStandbyPercent"
          />
        </div>
      </div>
      <div id="on-call-settings-period-caps-row" class="row-line" style="margin-top: 16px">
        <div class="form-group firstColumn">
          <label for="ocIncludeInPeriodCaps">&#8203;</label>
          <label class="checkbox-label">
            <input
              type="checkbox"
              [formField]="onCallForm.onCallIncludeInPeriodCaps"
              id="ocIncludeInPeriodCaps"
            />
            {{ "setting.onCall.includeInPeriodCaps" | translate }}
          </label>
        </div>
        <div class="form-group secondColumn"></div>
      </div>
      <div class="bottom-border-space"></div>
    </form>
  }
  }
  @if (activeTab() === 'manual') {
    <div id="on-call-settings-manual" class="manual-content" [innerHTML]="manualContent()"></div>
  }
  </div>
</div>
