<!-- eslint-disable @angular-eslint/template/click-events-have-key-events -->
<!-- eslint-disable @angular-eslint/template/interactive-supports-focus -->
<form id="absence-detail-row-form-{{ data.id }}">
  <div
    id="absence-detail-row-container-{{ data.id }}"
    class="first custom-control-inline"
  >
    <div class="form-group">
      <input
        id="absence-detail-row-name-{{ data.id }}"
        type="text"
        [value]="data.detailName | fallback: translate.currentLang"
        name="absenceDetailName"
        class="form-control attribute-name"
        aria-label="absence detail name"
        (click)="onClickEdit()"
        readonly
      />
    </div>

    <span
      id="absence-detail-row-delete-{{ data.id }}"
      class="delete-button"
      type="button"
      (click)="onClickDelete()"
      ><app-icon-trash-red /></span
    >
  </div>
</form>
