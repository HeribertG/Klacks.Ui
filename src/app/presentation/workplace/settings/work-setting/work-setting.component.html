<div id="work-setting-container" class="container-dashboard">
  <div id="work-setting-header" class="container-header">Planungen Grundeinstellungen</div>

  <div id="work-setting-line" class="container-line"></div>

  @if (isDataLoaded) {
  <form id="work-setting-form">
    <div id="work-setting-hours-row" class="row-line">
      <div class="form-group firstColumn">
        <label for="defaultWorkingHours">{{ 'settings.work.default-working-hours' | translate }}</label>
        <input
          type="number"
          step="0.5"
          class="form-control"
          [ngModel]="formModel().defaultWorkingHours"
          (ngModelChange)="updateField('defaultWorkingHours', $event)"
          aria-label="defaultWorkingHours"
          id="defaultWorkingHours"
        />
      </div>
      <div class="form-group secondColumn">
        <label for="overtimeThreshold">{{ 'settings.work.overtime-threshold' | translate }}</label>
        <input
          type="number"
          step="1"
          class="form-control"
          [ngModel]="formModel().overtimeThreshold"
          (ngModelChange)="updateField('overtimeThreshold', $event)"
          aria-label="overtimeThreshold"
          id="overtimeThreshold"
        />
      </div>
    </div>
    <div id="work-setting-vacation-row" class="row-line">
      <div class="form-group firstColumn">
        <label for="vacationDaysPerYear">{{ 'settings.work.vacation-days-per-year' | translate }}</label>
        <input
          type="number"
          step="1"
          class="form-control"
          [ngModel]="formModel().vacationDaysPerYear"
          (ngModelChange)="updateField('vacationDaysPerYear', $event)"
          aria-label="vacationDaysPerYear"
          id="vacationDaysPerYear"
        />
      </div>
      <div class="form-group secondColumn">
        <label for="probationPeriod">{{ 'settings.work.probation-period' | translate }}</label>
        <input
          type="number"
          step="1"
          class="form-control"
          [ngModel]="formModel().probationPeriod"
          (ngModelChange)="updateField('probationPeriod', $event)"
          aria-label="probationPeriod"
          id="probationPeriod"
        />
      </div>
    </div>
    <div id="work-setting-notice-payment-row" class="row-line">
      <div class="form-group firstColumn">
        <label for="noticePeriod">{{ 'settings.work.notice-period' | translate }}</label>
        <input
          type="number"
          step="1"
          class="form-control"
          [ngModel]="formModel().noticePeriod"
          (ngModelChange)="updateField('noticePeriod', $event)"
          aria-label="noticePeriod"
          id="noticePeriod"
        />
      </div>
      <div class="form-group secondColumn">
        <label for="paymentInterval">{{ 'settings.work.payment-interval' | translate }}</label>
        @if (hasContracts) {
          <select
            class="form-select"
            [value]="formModel().paymentInterval"
            aria-label="paymentInterval"
            id="paymentInterval"
            disabled
            [title]="'settings.work.payment-interval-locked' | translate"
          >
            <option value="0">{{ 'settings.work.payment-weekly' | translate }}</option>
            <option value="1">{{ 'settings.work.payment-biweekly' | translate }}</option>
            <option value="2">{{ 'settings.work.payment-monthly' | translate }}</option>
            <option value="3">{{ 'settings.work.payment-individual' | translate }}</option>
          </select>
        } @else {
          <select
            class="form-select"
            [value]="formModel().paymentInterval"
            (change)="onPaymentIntervalChange($event)"
            aria-label="paymentInterval"
            id="paymentInterval"
          >
            <option value="0">{{ 'settings.work.payment-weekly' | translate }}</option>
            <option value="1">{{ 'settings.work.payment-biweekly' | translate }}</option>
            <option value="2">{{ 'settings.work.payment-monthly' | translate }}</option>
            <option value="3">{{ 'settings.work.payment-individual' | translate }}</option>
          </select>
        }
      </div>
    </div>
    <div id="work-setting-guaranteed-maximum-row" class="row-line">
      <div class="form-group firstColumn">
        <label for="guaranteedHours">{{ 'settings.work.guaranteed-hours' | translate }}</label>
        <input
          type="number"
          step="1"
          class="form-control"
          [ngModel]="formModel().guaranteedHours"
          (ngModelChange)="updateField('guaranteedHours', $event)"
          aria-label="guaranteedHours"
          id="guaranteedHours"
        />
      </div>
      <div class="form-group secondColumn">
        <label for="maximumHours">{{ 'settings.work.maximum-hours' | translate }}</label>
        <input
          type="number"
          step="1"
          class="form-control"
          [ngModel]="formModel().maximumHours"
          (ngModelChange)="updateField('maximumHours', $event)"
          aria-label="maximumHours"
          id="maximumHours"
        />
      </div>
    </div>
    <div id="work-setting-minimum-fulltime-row" class="row-line">
      <div class="form-group firstColumn">
        <label for="minimumHours">{{ 'settings.work.minimum-hours' | translate }}</label>
        <input
          type="number"
          step="1"
          class="form-control"
          [ngModel]="formModel().minimumHours"
          (ngModelChange)="updateField('minimumHours', $event)"
          aria-label="minimumHours"
          id="minimumHours"
        />
      </div>
      <div class="form-group secondColumn">
        <label for="fullTime">{{ 'settings.work.full-time' | translate }}</label>
        <input
          type="number"
          step="1"
          class="form-control"
          [ngModel]="formModel().fullTime"
          (ngModelChange)="updateField('fullTime', $event)"
          aria-label="fullTime"
          id="fullTime"
        />
      </div>
    </div>
    <div id="work-setting-night-holiday-row" class="row-line">
      <div class="form-group firstColumn">
        <label for="nightRate">{{ 'settings.work.night-rate' | translate }} (%)</label>
        <input
          type="number"
          step="1"
          class="form-control"
          [ngModel]="formModel().nightRate"
          (ngModelChange)="updateField('nightRate', $event)"
          aria-label="nightRate"
          id="nightRate"
        />
      </div>
      <div class="form-group secondColumn">
        <label for="holidayRate">{{ 'settings.work.holiday-rate' | translate }} (%)</label>
        <input
          type="number"
          step="1"
          class="form-control"
          [ngModel]="formModel().holidayRate"
          (ngModelChange)="updateField('holidayRate', $event)"
          aria-label="holidayRate"
          id="holidayRate"
        />
      </div>
    </div>
    <div id="work-setting-sa-so-row" class="row-line">
      <div class="form-group firstColumn">
        <label for="saRate">{{ 'settings.work.sa-rate' | translate }} (%)</label>
        <input
          type="number"
          step="1"
          class="form-control"
          [ngModel]="formModel().saRate"
          (ngModelChange)="updateField('saRate', $event)"
          aria-label="saRate"
          id="saRate"
        />
      </div>
      <div class="form-group secondColumn">
        <label for="soRate">{{ 'settings.work.so-rate' | translate }} (%)</label>
        <input
          type="number"
          step="1"
          class="form-control"
          [ngModel]="formModel().soRate"
          (ngModelChange)="updateField('soRate', $event)"
          aria-label="soRate"
          id="soRate"
        />
      </div>
    </div>
    <div class="bottom-border-space"></div>
  </form>
  }
</div>
