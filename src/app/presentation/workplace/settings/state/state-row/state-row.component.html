<!-- eslint-disable @angular-eslint/template/click-events-have-key-events -->
<!-- eslint-disable @angular-eslint/template/interactive-supports-focus -->
<form id="state-row-form-{{ data!.id }}">
  <div id="state-row-container-{{ data!.id }}" class="first custom-control-inline">
    <div id="state-row-abbreviation-wrapper-{{ data!.id }}">
      <input
        id="state-row-abbreviation-{{ data!.id }}"
        type="text"
        [(ngModel)]="data!.abbreviation"
        (change)="onChange($event)"
        (keyup)="onKeyUp($event)"
        aria-label="data.abbreviation"
        name="data.abbreviation"
        class="form-control abbreviation"
      />
    </div>
    <div id="state-row-name-wrapper-{{ data!.id }}">
      @if (currentLang === 'de') {
      <input
        id="state-row-name-de-{{ data!.id }}"
        type="text"
        [(ngModel)]="data!.name!.de"
        (change)="onChange($event)"
        (keyup)="onKeyUp($event)"
        aria-label="data.name"
        name="data.name.de"
        class="form-control country-name"
      />
      } @if (currentLang === 'en') {
      <input
        id="state-row-name-en-{{ data!.id }}"
        type="text"
        [(ngModel)]="data!.name!.en"
        (change)="onChange($event)"
        (keyup)="onKeyUp($event)"
        aria-label="data.name"
        name="data.name.en"
        class="form-control country-name"
      />
      } @if (currentLang === 'fr') {
      <input
        id="state-row-name-fr-{{ data!.id }}"
        type="text"
        [(ngModel)]="data!.name!.fr"
        (change)="onChange($event)"
        (keyup)="onKeyUp($event)"
        aria-label="data.name"
        name="data.name.fr"
        class="form-control country-name"
      />
      } @if (currentLang === 'it') {
      <input
        id="state-row-name-it-{{ data!.id }}"
        type="text"
        [(ngModel)]="data!.name!.it"
        (change)="onChange($event)"
        (keyup)="onKeyUp($event)"
        aria-label="data.name"
        name="data.name.it"
        class="form-control country-name"
      />
      }
    </div>
    <div id="state-row-prefix-wrapper-{{ data!.id }}">
      <input
        id="state-row-prefix-{{ data!.id }}"
        type="text"
        [(ngModel)]="data!.countryPrefix"
        (change)="onChange($event)"
        (keyup)="onKeyUp($event)"
        aria-label="data.prefix"
        name="data.prefix"
        class="form-control country-prefix"
      />
    </div>

    <span id="state-row-delete-{{ data!.id }}" class="delete-button" type="button" (click)="onClickDelete()">✕</span>
  </div>
</form>
