<!-- eslint-disable @angular-eslint/template/click-events-have-key-events -->
<!-- eslint-disable @angular-eslint/template/interactive-supports-focus -->
<div
  id="user-admin-row-container-{{ user()!.id }}"
  class="first custom-control-inline"
>
  <div id="user-admin-row-name-group-{{ user()!.id }}" class="form-group">
    <input
      id="user-admin-row-name-{{ user()!.id }}"
      type="text"
      [value]="userName"
      class="form-control gap"
      [class.editable]="enabled()"
      readonly
      aria-label="name"
      (dblclick)="onDoubleClickEdit()"
    />
  </div>

  <div id="user-admin-row-email-group-{{ user()!.id }}" class="form-group">
    <input
      id="user-admin-row-email-{{ user()!.id }}"
      type="email"
      [value]="userEmail"
      class="form-control gap"
      readonly
      aria-label="email"
    />
    @if (user()!.isDirectoryLoginOnly) {
    <span id="user-admin-row-directory-login-{{ user()!.id }}" class="directory-login">{{ 'setting.user-admin.row.directory-login' | translate }}</span>
    } @else if (enabled()) {
    <span id="user-admin-row-sendto-{{ user()!.id }}" class="send-to" (click)="onClickSentTo()">{{ 'setting.user-admin.row.send' | translate }}</span>
    }
  </div>
  <div id="user-admin-row-rights-group-{{ user()!.id }}" class="form-group">
    @if (enabled()) {
      <select
        id="user-admin-row-rights-{{ user()!.id }}"
        [formField]="userRightsForm.rights"
        class="form-select"
        [attr.aria-label]="'setting.user-admin.header.rights' | translate"
      >
        <option [value]="rightsLevels.Planner">
          {{ 'setting.user-admin.row.rights.planner' | translate }}
        </option>
        <option [value]="rightsLevels.Supervisor">
          {{ 'setting.user-admin.row.rights.supervisor' | translate }}
        </option>
        <option [value]="rightsLevels.Admin">
          {{ 'setting.user-admin.row.rights.admin' | translate }}
        </option>
      </select>
    } @else {
      <select
        id="user-admin-row-rights-{{ user()!.id }}"
        class="form-select"
        disabled
        [attr.aria-label]="'setting.user-admin.header.rights' | translate"
      >
        <option [selected]="currentRights() === rightsLevels.Planner">
          {{ 'setting.user-admin.row.rights.planner' | translate }}
        </option>
        <option [selected]="currentRights() === rightsLevels.Supervisor">
          {{ 'setting.user-admin.row.rights.supervisor' | translate }}
        </option>
        <option [selected]="currentRights() === rightsLevels.Admin">
          {{ 'setting.user-admin.row.rights.admin' | translate }}
        </option>
      </select>
    }
  </div>
  <div id="user-admin-row-actions-group-{{ user()!.id }}" class="actions-group">
    @if (enabled()) {
      <span
        id="user-admin-row-deactivate-{{ user()!.id }}"
        class="delete-button"
        type="button"
        [title]="'setting.user-admin.row.deactivate-hint' | translate"
        (click)="onDeactivate()"
        ><app-icon-trash-red
      /></span>
    }
  </div>
</div>
