<!-- eslint-disable @angular-eslint/template/click-events-have-key-events -->
<!-- eslint-disable @angular-eslint/template/interactive-supports-focus -->
<form id="llm-providers-row-form-{{ data.providerId }}">
  <div id="llm-providers-row-container-{{ data.providerId }}" class="first custom-control-inline">
    <div class="form-group">
      <input
        id="llm-providers-row-display-{{ data.providerId }}"
        type="text"
        [value]="getProviderDisplayText()"
        name="providerDisplay"
        class="form-control attribute-name"
        aria-label="provider display"
        (click)="onEdit()"
        readonly
      />
    </div>

    <span
      id="llm-providers-row-delete-{{ data.providerId }}"
      class="delete-button"
      type="button"
      (click)="onDelete()"
      [class.disabled]="!canDelete"
      [title]="!canDelete ? (translate.instant('settings.llm-providers.cannot-delete-default-provider') || 'Provider of default model cannot be deleted') : ''"
    >✕</span>
  </div>
</form>
