<div class="modal-header">
  <div class="container-header-modal modal-title">
    {{ absenceService.absenceModalTitle }}
  </div>
  <span class="filler"></span>
  <div
    type="button"
    class="close"
    aria-label="Close"
    (click)="modal().dismiss()"
  >
    <span
      aria-hidden="true"
      style="
        font-size: 13px;
        border: 1px transparent solid;
        color: var(--colorWorkplaceHeadline);
      "
      >&times;</span
    >
  </div>
</div>
<div class="modal-body first-modal">
  <div class="row-line-modal-inline1">
    <div class="property-field">
      <label>
        {{ "shift.container-template.properties.start-time" | translate }}
      </label>
      <app-time-input
        [value]="absenceService.absenceStartTime"
        (valueChange)="absenceService.onAbsenceStartTimeChange($event)"
        [showLabel]="false"
        [forDuration]="false"
      ></app-time-input>
    </div>
    <div class="property-field">
      <label>
        {{ "shift.container-template.properties.end-time" | translate }}
      </label>
      <app-time-input
        [value]="absenceService.absenceEndTime"
        (valueChange)="absenceService.onAbsenceEndTimeChange($event)"
        [showLabel]="false"
        [forDuration]="false"
      ></app-time-input>
    </div>
  </div>
</div>
<div class="modal-footer">
  <span
    type="button"
    class="link-button red-font"
    (click)="modal().dismiss()"
    >{{ "cancel" | translate }}</span
  >
  <button type="button" class="btn save-btn" (click)="modal().close()">
    {{ "save" | translate }}
  </button>
</div>
