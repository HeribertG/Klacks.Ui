<form #navGroupForm="ngForm" id="navShiftForm">
  <ul class="list-group">
    <!-- Gültigkeit -->
    <li class="list-group-item-action">
      <div ngbDropdown>
        <button
          class="btn btn-outline-primary btn-sm max-width"
          id="dropdownForm-1"
          ngbDropdownToggle
        >
          {{ "address.all-address.all-address-nav.validity" | translate }}
        </button>
        <div ngbDropdownMenu aria-labelledby="dropdownForm-1">
          <div class="form-group">
            <div class="checkbox-container-default">
              <label class="checkbox-label">
                <input
                  type="checkbox"
                  [(ngModel)]="
                    dataManagementShiftService.currentFilter.activeDateRange
                  "
                  name="activeDateRange"
                />
                {{ "active" | translate }}
              </label>

              <label class="checkbox-label">
                <input
                  type="checkbox"
                  [(ngModel)]="
                    dataManagementShiftService.currentFilter.formerDateRange
                  "
                  name="formerDateRange"
                />
                {{ "former" | translate }}
              </label>

              <label class="checkbox-label">
                <input
                  type="checkbox"
                  [(ngModel)]="
                    dataManagementShiftService.currentFilter.futureDateRange
                  "
                  name="futureDateRange"
                />
                {{ "future" | translate }}
              </label>
            </div>
          </div>
          <div class="dropdown-divider"></div>

          <button ngbDropdownItem (click)="onClose()">
            {{ "close" | translate }}
          </button>
        </div>
      </div>
    </li>
    
    <!-- Original/Planbar Options -->
    <li class="list-group-item-action">
      <div class="form-group">
        <div class="radio-container">
          <label class="radio-label">
            <input
              id="shift-filter-original"
              type="radio"
              name="shiftType"
              [value]="true"
              [(ngModel)]="dataManagementShiftService.currentFilter.isOriginal"
              [disabled]="!authorizationService.isAdmin"
              (change)="onSelect()"
            />
            {{ "shift.all-shift.nav.original" | translate }}
          </label>

          <label class="radio-label">
            <input
              id="shift-filter-planbar"
              type="radio"
              name="shiftType"
              [value]="false"
              [(ngModel)]="dataManagementShiftService.currentFilter.isOriginal"
              [disabled]="!authorizationService.isAdmin"
              (change)="onSelect()"
            />
            {{ "shift.all-shift.nav.planbar" | translate }}
          </label>
        </div>
      </div>
    </li>
  </ul>
</form>
