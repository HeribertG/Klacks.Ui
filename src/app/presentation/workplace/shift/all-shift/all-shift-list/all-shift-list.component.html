<form id="allShiftForm">
  <div class="container-header header-container">
    {{ translate.instant("shift.all-shift.list.title") }}

    <span class="filler"></span>
    @if (authorizationService.isAdmin && dataManagementShiftService.currentFilter.isOriginal){
    <div class="actions">
      <button id="shift-create-btn" class="btn new-btn" (click)="onAddShift()">
        {{ "new-work" | translate }}
      </button>
    </div>
    }
  </div>
  <div class="container-line"></div>
  <div class="container-table" #shiftTableContainer>
    @if (dataManagementShiftService.currentFilter.isOriginal) {
      <app-original-table
        [shifts]="dataManagementShiftService.shifts"
        [sortingService]="sortingService"
        (editClicked)="onClickEdit($event)"
        (deleteClicked)="onClickDelete($event)"
        (headerClicked)="onClickHeader($event)"
      ></app-original-table>
    } @else {
      <app-cut-table
        [shifts]="dataManagementShiftService.shifts"
        [sortingService]="sortingService"
        (editClicked)="onClickEdit($event)"
        (cutClicked)="onClickCut($event)"
        (headerClicked)="onClickHeader($event)"
      ></app-cut-table>
    }
    @if (paginationDataService) {
    <app-pagination
      [dataService]="paginationDataService"
      [(page)]="page"
      [numberOfItemsPerPage]="dataManagementShiftService.currentFilter.numberOfItemsPerPage"
      (pageChange)="onPageChange($event)"
      (numberOfItemsPerPageChange)="onItemsPerPageChange($event)"
      (rowSizeChange)="onChangeRowSize($event)"
    >
    </app-pagination>
    }
  </div>
</form>
