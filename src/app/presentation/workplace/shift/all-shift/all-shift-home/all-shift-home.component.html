<div
  id="all-shift-home-container"
  class="container-dashboard"
  data-klacksy-target="shifts"
  data-klacksy-label-key="nav.shifts"
  data-klacksy-category="scheduling.shifts"
  data-klacksy-route="/workplace/shift"
>
  <div class="container-headline">
    {{ "shift.all-shift.all-shift-home.header" | translate }}
    <app-nav-toggle
      id="shift-nav-toggle"
      [(open)]="navOpen"
      [filterActive]="isFilterActive()"
    ></app-nav-toggle>
  </div>

  <div
    id="shift-nav"
    class="container-address-nav nav-collapsible border-right-card border-bottom-card"
    [class.nav-open]="navOpen()"
  >
    <app-all-shift-nav></app-all-shift-nav>
  </div>

  <div class="container-profilline">
    <app-all-shift-list
      class="container-profile first border-right-card border-bottom-card"
    >
    </app-all-shift-list>
  </div>

  <div class="bottom-border-space"></div>
  <div class="bottom-border-space"></div>
</div>
