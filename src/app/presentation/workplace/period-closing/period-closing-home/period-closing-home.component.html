<div
  id="period-closing-container"
  class="container-dashboard"
  data-klacksy-target="period-closing"
  data-klacksy-label-key="nav.periodClosing"
  data-klacksy-category="scheduling.closing"
  data-klacksy-route="/workplace/period-closing"
>
  <div id="period-closing-headline" class="container-headline">
    {{ 'periodClosing.title' | translate }}
  </div>

  <div id="period-closing-periods-row" class="container-profilline">
    <app-periods-tab
      id="period-closing-periods"
      class="container-profile first border-right-card border-bottom-card"
    ></app-periods-tab>
  </div>

  <div id="period-closing-exports-row" class="container-profilline">
    <app-exports-tab
      id="period-closing-exports"
      class="container-profile first border-right-card border-bottom-card"
    ></app-exports-tab>
  </div>

  <div id="period-closing-audit-row" class="container-profilline">
    <app-audit-tab
      id="period-closing-audit"
      class="container-profile first border-right-card border-bottom-card"
    ></app-audit-tab>
  </div>

  <div class="bottom-border-space"></div>
</div>
