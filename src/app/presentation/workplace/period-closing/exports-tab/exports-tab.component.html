<div id="exports-tab-container" class="container-dashboard">
  <div id="exports-tab-header" class="container-header">
    {{ 'periodClosing.tabs.exports' | translate }}
  </div>

  <div id="exports-tab-line" class="container-line"></div>

  <div class="first exports-tab-body">
    <section class="filter-row">
      <div class="filter-field">
        <label class="form-label" for="exportsFilterFrom">{{ 'periodClosing.form.filterFrom' | translate }}</label>
        <app-date-input
          inputId="exportsFilterFrom"
          [showLabel]="false"
          [value]="filterFrom()"
          (valueChange)="filterFrom.set($event ?? null)">
        </app-date-input>
      </div>
      <div class="filter-field">
        <label class="form-label" for="exportsFilterUntil">{{ 'periodClosing.form.filterUntil' | translate }}</label>
        <app-date-input
          inputId="exportsFilterUntil"
          [showLabel]="false"
          [value]="filterUntil()"
          (valueChange)="filterUntil.set($event ?? null)">
        </app-date-input>
      </div>
      <div class="filter-field filter-action">
        <button
          type="button"
          class="btn btn-outline-secondary btn-sm"
          (click)="reloadOrders()"
          [disabled]="loadingOrders()">
          {{ 'periodClosing.action.refresh' | translate }}
        </button>
      </div>
    </section>

    <section class="filter-row">
      <div class="filter-field filter-field-wide order-search">
        <label class="form-label" for="exportsSearch">{{ 'periodClosing.form.order' | translate }}</label>
        <app-search-input
          inputId="exportsSearch"
          [placeholderKey]="'periodClosing.form.searchPlaceholder'"
          [value]="searchTerm()"
          [showButton]="true"
          [isLoading]="loadingOrders()"
          [debounceMs]="300"
          (valueChange)="onSearchChange($event)"
          (searchSubmit)="onSearchChange($event)">
        </app-search-input>

        @if (showOrderResults()) {
          <ul class="dropdown-menu order-results" role="listbox">
            @if (orders().length === 0 && !loadingOrders()) {
              <li class="dropdown-item order-result-empty" aria-disabled="true">{{ 'periodClosing.form.orderEmpty' | translate }}</li>
            } @else {
              @for (order of orders(); track order.id) {
                <li
                  class="dropdown-item order-result"
                  role="option"
                  [class.selected]="selectedOrderId() === order.id"
                  [attr.aria-selected]="selectedOrderId() === order.id"
                  tabindex="0"
                  (click)="onOrderSelected(order)"
                  (keydown.enter)="onOrderSelected(order)"
                  (keydown.space)="onOrderSelected(order); $event.preventDefault()">
                  {{ formatOrderLabel(order) }}
                </li>
              }
            }
          </ul>
        }
      </div>
      <div class="filter-field">
        <label class="form-label" for="exportFormat">{{ 'periodClosing.form.format' | translate }}</label>
        <select
          id="exportFormat"
          class="form-select form-select-sm"
          [ngModel]="format()"
          (ngModelChange)="format.set($event)">
          @for (f of formats; track f.key) {
            <option [value]="f.key">{{ f.labelKey | translate }}</option>
          }
        </select>
      </div>
      <div class="filter-field filter-action">
        <button
          type="button"
          class="btn btn-primary btn-sm"
          [disabled]="busy() || !selectedOrderId()"
          (click)="onExport()">
          @if (busy()) {
            <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
          }
          {{ 'periodClosing.action.export' | translate }}
        </button>
      </div>
    </section>
  </div>

  <div class="bottom-border-space"></div>
</div>
