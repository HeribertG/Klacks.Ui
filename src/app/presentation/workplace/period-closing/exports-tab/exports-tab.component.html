<div id="exports-tab-container" class="container-dashboard">
  <div id="exports-tab-header" class="container-header">
    {{ 'periodClosing.tabs.exports' | translate }}
  </div>

  <div id="exports-tab-line" class="container-line"></div>

  <div class="first exports-tab-body">
    <section class="filter-row">
      <div class="filter-field">
        <label class="form-label" for="exportsFilterFrom">{{ 'periodClosing.form.filterFrom' | translate }}</label>
        <app-date-input
          inputId="exportsFilterFrom"
          [showLabel]="false"
          [value]="filterFrom()"
          (valueChange)="filterFrom.set($event ?? null)">
        </app-date-input>
      </div>
      <div class="filter-field">
        <label class="form-label" for="exportsFilterUntil">{{ 'periodClosing.form.filterUntil' | translate }}</label>
        <app-date-input
          inputId="exportsFilterUntil"
          [showLabel]="false"
          [value]="filterUntil()"
          (valueChange)="filterUntil.set($event ?? null)">
        </app-date-input>
      </div>
      <div class="filter-field filter-action">
        <button
          type="button"
          class="btn btn-outline-secondary btn-sm"
          (click)="reloadOrders()"
          [disabled]="loadingOrders()">
          {{ 'periodClosing.action.refresh' | translate }}
        </button>
      </div>
    </section>

    <section class="filter-row">
      <div class="filter-field filter-field-wide">
        <label class="form-label" for="exportsOrder">{{ 'periodClosing.form.order' | translate }}</label>
        @if (loadingOrders()) {
          <div class="loading-hint text-muted">
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          </div>
        } @else if (orders().length === 0) {
          <div class="text-muted">{{ 'periodClosing.form.orderEmpty' | translate }}</div>
        } @else {
          <select
            id="exportsOrder"
            class="form-select form-select-sm"
            [ngModel]="selectedOrderId()"
            (ngModelChange)="selectedOrderId.set($event)">
            <option [ngValue]="null">{{ 'periodClosing.form.orderPlaceholder' | translate }}</option>
            @for (order of orders(); track order.id) {
              <option [ngValue]="order.id">{{ formatOrderLabel(order) }}</option>
            }
          </select>
        }
      </div>
      <div class="filter-field">
        <label class="form-label" for="exportFormat">{{ 'periodClosing.form.format' | translate }}</label>
        <select
          id="exportFormat"
          class="form-select form-select-sm"
          [ngModel]="format()"
          (ngModelChange)="format.set($event)">
          @for (f of formats; track f.key) {
            <option [value]="f.key">{{ f.labelKey | translate }}</option>
          }
        </select>
      </div>
      <div class="filter-field filter-field-narrow">
        <label class="form-label" for="exportLanguage">{{ 'periodClosing.form.language' | translate }}</label>
        <input
          id="exportLanguage"
          type="text"
          class="form-control form-control-sm"
          maxlength="5"
          [ngModel]="language()"
          (ngModelChange)="language.set($event)">
      </div>
      <div class="filter-field filter-field-narrow">
        <label class="form-label" for="exportCurrency">{{ 'periodClosing.form.currency' | translate }}</label>
        <input
          id="exportCurrency"
          type="text"
          class="form-control form-control-sm"
          maxlength="3"
          [ngModel]="currency()"
          (ngModelChange)="currency.set($event)">
      </div>
      <div class="filter-field filter-action">
        <button
          type="button"
          class="btn btn-primary btn-sm"
          [disabled]="busy() || !selectedOrderId()"
          (click)="onExport()">
          @if (busy()) {
            <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
          }
          {{ 'periodClosing.action.export' | translate }}
        </button>
      </div>
    </section>
  </div>

  <div class="bottom-border-space"></div>
</div>
