# .github/workflows/deploy.yml for Klacks.Ui
name: Test & Deploy Klacks.Ui to Hetzner

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - '**'
      - '!README.md'
      - '!docs/**'
  workflow_dispatch:

concurrency:
  group: deploy-klacks-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Build plugin contracts
      run: npx ng build klacks-plugin-contracts

    - name: Run Vitest
      run: |
        npm run test:no-report || true
        if [ -f test-results/results.json ]; then
          FAILED=$(node -e "const r=require('./test-results/results.json'); const f=r.testResults?.filter(t=>t.status==='failed')?.length||0; console.log(f);")
          echo "Failed tests: $FAILED"
          if [ "$FAILED" != "0" ]; then
            echo "::error::$FAILED test(s) failed"
            exit 1
          fi
        else
          echo "::error::No test results found"
          exit 1
        fi
      env:
        NODE_OPTIONS: '--max-old-space-size=1536'

    - name: Lint
      run: npx ng lint

  # Phase 0.3: build + push the release UI image to ghcr.io on a v* tag (parallel to the legacy
  # build-on-server deploy below, which still runs on main).
  build-and-push:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Extract version from tag
      id: version
      run: |
        VERSION="${GITHUB_REF#refs/tags/v}"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "major=$(echo "$VERSION" | cut -d. -f1)" >> "$GITHUB_OUTPUT"
        echo "minor=$(echo "$VERSION" | cut -d. -f2)" >> "$GITHUB_OUTPUT"

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Klacks.Ui image (linux/arm64)
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        # Multi-arch: arm64 for Hetzner (Ampere), amd64 for on-prem customers (Docker Desktop).
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ghcr.io/heribertg/klacks-ui:${{ steps.version.outputs.version }}
          ghcr.io/heribertg/klacks-ui:${{ steps.version.outputs.major }}.${{ steps.version.outputs.minor }}
          ghcr.io/heribertg/klacks-ui:${{ steps.version.outputs.major }}
          ghcr.io/heribertg/klacks-ui:latest

  # Server deploy removed in the UI image-mode cutover. Klacks.Ui no longer builds on the server;
  # this repo only builds + pushes the ghcr image (build-and-push above). The Klacks.Api deploy job
  # owns the server: on a stable vX.Y.Z tag it pulls + recreates BOTH klacks-api and klacks-ui at the
  # same version (single deploy owner avoids compose-sync / double-recreate races). The out-of-process
  # updater applies subsequent UI updates via DockerApplier. Releases must tag Klacks.Api AND Klacks.Ui
  # with the same vX.Y.Z (scripts/release.sh) so klacks-ui:<tag> exists for the API deploy to pull.
