events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  charset utf-8;

  server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_types
      text/plain
      text/css
      text/xml
      text/javascript
      application/javascript
      application/xml+rss
      application/json;

    # Runtime-loaded, unhashed assets (i18n JSON, manual HTML docs):
    # must revalidate on every request so deploys are picked up immediately.
    # Placed before the SPA fallback and the hashed-asset regex so it wins
    # for these paths regardless of extension.
    location ~* ^/assets/(i18n/.+\.json|docs/.+\.html)$ {
      add_header Cache-Control "no-cache";
    }

    # Handle Angular routing
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
  }
}