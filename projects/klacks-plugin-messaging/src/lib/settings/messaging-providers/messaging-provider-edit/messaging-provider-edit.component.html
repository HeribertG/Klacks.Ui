<form id="messaging-provider-edit-form">
  <div id="messaging-provider-edit-name-row" class="row-line-modal-inline">
    <div class="provider-field full-width">
      <label for="providerName">{{ 'settings.messaging-providers.field.name' | translate }}</label>
      <input
        id="messaging-provider-edit-name"
        type="text"
        [(ngModel)]="name"
        name="name"
        class="form-control"
        [placeholder]="'Mein SMS Dienst'"
      />
    </div>
  </div>

  <div id="messaging-provider-edit-type-row" class="row-line-modal-inline">
    <div class="provider-field">
      <label for="providerType">{{ 'settings.messaging-providers.field.type' | translate }}</label>
      <select
        id="messaging-provider-edit-type"
        [(ngModel)]="providerType"
        name="providerType"
        class="form-control"
        (ngModelChange)="onProviderTypeChange()"
      >
        @for (type of providerTypes; track type) {
          <option [value]="type">{{ type }}</option>
        }
      </select>
    </div>
    <div class="provider-field">
      <div class="checkbox-container">
        <input
          id="messaging-provider-edit-enabled"
          type="checkbox"
          [(ngModel)]="isEnabled"
          name="isEnabled"
        />
        <label for="messaging-provider-edit-enabled">
          {{ 'settings.messaging-providers.field.enabled' | translate }}
        </label>
      </div>
    </div>
  </div>

  <div class="config-section">
    <div class="config-section-title">
      {{ 'settings.messaging-providers.field.config-title' | translate }}
    </div>

    @for (field of getFieldDefinitions(); track field.key) {
      <div class="row-line-modal-inline">
        <div class="provider-field full-width">
          <label [for]="'config-' + field.key">{{ field.labelDe }}</label>
          <input
            [id]="'messaging-provider-edit-config-' + field.key"
            [type]="field.type"
            [(ngModel)]="configFields[field.key]"
            [name]="'config_' + field.key"
            class="form-control"
            [class.readonly-field]="field.readonly"
            [placeholder]="field.placeholder"
            [readonly]="field.readonly"
            autocomplete="off"
          />
        </div>
      </div>
    }
  </div>
</form>

<div id="messaging-provider-edit-footer" class="modal-footer">
  <span
    id="messaging-provider-edit-cancel-btn"
    class="link-button red-font"
    tabindex="0"
    (click)="onCancel()"
    (keydown.enter)="onCancel()"
  >{{ 'cancel' | translate }}</span>
  <button
    id="messaging-provider-edit-save-btn"
    type="button"
    class="btn save-btn"
    (click)="onSave()"
    [disabled]="!isFormValid()"
  >
    {{ 'save' | translate }}
  </button>
</div>
