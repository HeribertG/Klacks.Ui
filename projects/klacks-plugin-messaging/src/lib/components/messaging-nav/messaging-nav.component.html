<form #navMessagingForm="ngForm" id="navMessagingForm">
  <ul class="list-group">
    <li class="list-group-item-label">
      {{ "messaging.nav.direction" | translate }}
    </li>
    <li class="list-group-item-action">
      <label class="radio-label">
        <input
          type="radio"
          name="direction"
          [value]="undefined"
          [(ngModel)]="directionValue"
          (ngModelChange)="onDirectionChange()"
        />
        {{ "messaging.nav.direction.all" | translate }}
      </label>
    </li>
    <li class="list-group-item-action">
      <label class="radio-label">
        <input
          type="radio"
          name="direction"
          [value]="MessageDirection.Inbound"
          [(ngModel)]="directionValue"
          (ngModelChange)="onDirectionChange()"
        />
        {{ "messaging.nav.direction.inbound" | translate }}
      </label>
    </li>
    <li class="list-group-item-action">
      <label class="radio-label">
        <input
          type="radio"
          name="direction"
          [value]="MessageDirection.Outbound"
          [(ngModel)]="directionValue"
          (ngModelChange)="onDirectionChange()"
        />
        {{ "messaging.nav.direction.outbound" | translate }}
      </label>
    </li>

    <li class="list-group-item-divider"></li>

    <li class="list-group-item-label">
      {{ "messaging.nav.scope" | translate }}
    </li>
    <li class="list-group-item-action">
      <label class="radio-label">
        <input
          type="radio"
          name="scope"
          [value]="undefined"
          [(ngModel)]="scopeValue"
          (ngModelChange)="onScopeChange()"
        />
        {{ "messaging.nav.scope.all" | translate }}
      </label>
    </li>
    <li class="list-group-item-action">
      <label class="radio-label">
        <input
          type="radio"
          name="scope"
          [value]="MessageScope.Client"
          [(ngModel)]="scopeValue"
          (ngModelChange)="onScopeChange()"
        />
        {{ "messaging.nav.scope.client" | translate }}
      </label>
    </li>
    <li class="list-group-item-action">
      <label class="radio-label">
        <input
          type="radio"
          name="scope"
          [value]="MessageScope.Internal"
          [(ngModel)]="scopeValue"
          (ngModelChange)="onScopeChange()"
        />
        {{ "messaging.nav.scope.internal" | translate }}
      </label>
    </li>

    @if (providers().length > 1) {
      <li class="list-group-item-divider"></li>

      <li class="list-group-item-label">
        {{ "messaging.nav.providers" | translate }}
      </li>
      @for (provider of providers(); track provider.id) {
        <li class="list-group-item-action">
          <label class="checkbox-label">
            <input
              type="checkbox"
              [checked]="isProviderSelected(provider.id)"
              (change)="onProviderToggle(provider.id)"
              [name]="'provider_' + provider.id"
            />
            {{ provider.displayName }}
          </label>
        </li>
      }
    }

    @if (hasMore || showAllValue) {
      <li class="list-group-item-divider"></li>

      <li class="list-group-item-action">
        <label class="checkbox-label">
          <input
            type="checkbox"
            name="showAll"
            [(ngModel)]="showAllValue"
            (ngModelChange)="onShowAllChange()"
          />
          {{ "messaging.nav.show-all" | translate }}
        </label>
      </li>
    }

    <li class="list-group-item-divider"></li>

    <li class="list-group-item-action">
      <button class="btn btn-sm" type="button" (click)="onResetFilter()">
        {{ "messaging.nav.reset" | translate }}
      </button>
    </li>
  </ul>
</form>
